<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>استوديو التبييض الاحترافي - FutaArab</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070709;
      --glass-bg: rgba(20, 20, 26, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent: #ff2a5f;
      --accent-glow: rgba(255, 42, 95, 0.35);
      --text: #ffffff;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-dark); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 140px; }

    /* الشريط العلوي */
    .top-bar {
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: var(--glass-bg);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--glass-border);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; color: var(--accent); }
    .brand span { color: var(--text); font-size: 12px; font-weight: 500; opacity: 0.7; }

    .top-actions { display: flex; gap: 6px; align-items: center; }
    .btn-sm {
      padding: 7px 12px; border-radius: 8px; border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.06); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .btn-primary { background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }
    .btn-success { background: #10b981; border-color: #10b981; }
    .btn-sm:disabled { opacity: 0.4; pointer-events: none; }

    /* شريط التنقل بين الصفحات */
    .page-nav {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 650px; margin: 10px auto; padding: 8px 12px;
      background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px;
    }
    .status-badge { font-size: 12px; color: #fbbf24; text-align: center; margin: 6px 0; font-weight: 700; }

    /* مساحة العمل (الكانفاس) */
    .workspace {
      width: 100%; max-width: 750px; margin: 0 auto; text-align: center;
      position: relative; padding: 0 6px;
    }
    .canvas-wrapper {
      display: inline-block; position: relative; width: 100%;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid var(--glass-border);
      background: #111;
    }
    canvas { width: 100%; height: auto; display: block; }
    canvas.brush-active { touch-action: none; }

    /* مؤشر حجم ولون الفرشاة في وسط الشاشة عند التغيير */
    #brushPreview {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border-radius: 50%; border: 2px solid var(--accent); pointer-events: none;
      z-index: 9999; display: none; box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    /* الشريط العائم الذكي (يبقى معك حتى مع الزوم!) */
    #floatingDock {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 9000; width: 94%; max-width: 440px;
      background: rgba(18, 18, 24, 0.90);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px; padding: 10px 12px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 42, 95, 0.2);
      transition: opacity 0.15s;
      transform-origin: center bottom;
    }
    .dock-handle {
      width: 42px; height: 5px; background: rgba(255,255,255,0.25);
      border-radius: 10px; margin: 0 auto 8px auto; cursor: grab; touch-action: none;
    }
    .dock-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .dock-row + .dock-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); }

    .tool-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 8px 4px; border-radius: 12px; border: 1px solid transparent;
      background: rgba(255,255,255,0.05); color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .tool-btn span.icon { font-size: 16px; }
    .tool-btn.active {
      background: rgba(255, 42, 95, 0.18); color: #fff;
      border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow);
    }

    /* منتقي اللون الدائري والأحجام السريعة */
    .color-picker-wrap {
      position: relative; width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid #fff; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }
    .color-picker-wrap input[type="color"] {
      position: absolute; top: -10px; left: -10px; width: 54px; height: 54px;
      border: none; cursor: pointer; background: none;
    }
    .preset-colors { display: flex; gap: 5px; align-items: center; }
    .color-dot {
      width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.4); cursor: pointer;
    }

    .size-slider { flex: 1; accent-color: var(--accent); height: 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <div class="top-bar">
    <div class="brand">
      FutaArab <span>استوديو التبييض</span>
    </div>
    <div class="top-actions">
      <label class="btn-sm btn-primary" for="fileInput">📁 رفع فصل</label>
      <input type="file" id="fileInput" accept=".zip,image/*" multiple style="display:none;">
      <button class="btn-sm" id="zipBtn" onclick="downloadZip()" disabled>📦 ZIP</button>
      <button class="btn-sm btn-success" id="sendBtn" onclick="sendToUploaderPage()" disabled>🚀 للنشر</button>
    </div>
  </div>

  <div class="status-badge" id="statusMsg">ارفع ملف ZIP أو صور المانغا للبدء بالتبييض...</div>

  <!-- شريط التنقل بين الصفحات -->
  <div class="page-nav">
    <button class="btn-sm" onclick="changePage(-1)">◀ السابقة</button>
    <span id="pageCount" style="font-weight:900; font-size:14px; color:var(--accent);">0 / 0</span>
    <button class="btn-sm" onclick="changePage(1)">التالية ▶</button>
  </div>

  <!-- منطقة الصفحة -->
  <div class="workspace">
    <div class="canvas-wrapper">
      <canvas id="pageCanvas" class="brush-active"></canvas>
    </div>
  </div>

  <!-- دائرة معاينة حجم الفرشاة -->
  <div id="brushPreview"></div>

  <!-- الشريط العائم الذكي (يتحرك معك عند الزوم) -->
  <div id="floatingDock">
    <div class="dock-handle" id="dockHandle" title="اسحب لتحريك الشريط"></div>
    
    <!-- الصف الأول: الأدوات الرئيسية -->
    <div class="dock-row">
      <button class="tool-btn active" id="btnBrush" onclick="setTool('brush')">
        <span class="icon">🖌️</span>
        <span>فرشاة</span>
      </button>
      <button class="tool-btn" id="btnSmart" onclick="setTool('smart')">
        <span class="icon">✨</span>
        <span>فرشاة ذكية</span>
      </button>
      <button class="tool-btn" id="btnPicker" onclick="setTool('picker')">
        <span class="icon">💧</span>
        <span>لقط اللون</span>
      </button>
      <button class="tool-btn" id="btnMove" onclick="setTool('move')">
        <span class="icon">🖐️</span>
        <span>تحريك/زوم</span>
      </button>
      <button class="tool-btn" onclick="undoLastAction()">
        <span class="icon">↩️</span>
        <span>تراجع</span>
      </button>
    </div>

    <!-- الصف الثاني: التحكم بحجم ولون الفرشاة -->
    <div class="dock-row">
      <!-- اختيار اللون -->
      <div class="color-picker-wrap" title="تغيير لون الفرشاة">
        <input type="color" id="brushColor" value="#ffffff" onchange="updateBrushColor(this.value)">
      </div>
      <div class="preset-colors">
        <div class="color-dot" style="background:#ffffff;" onclick="setPresetColor('#ffffff')" title="أبيض"></div>
        <div class="color-dot" style="background:#000000;" onclick="setPresetColor('#000000')" title="أسود"></div>
      </div>

      <!-- شريط حجم الفرشاة -->
      <input type="range" class="size-slider" id="brushSize" min="6" max="90" value="32" oninput="showBrushPreview()">
      <span id="sizeVal" style="font-size:11px; font-weight:bold; min-width:26px; text-align:center;">32</span>

      <button class="btn-sm" style="padding:5px 8px; font-size:11px;" onclick="resetCurrentPage()" title="إعادة الصفحة كما كانت">🔄</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('pageCanvas');
const ctx = canvas.getContext('2d');
let pages = []; // [{ name, originalImg, workCanvas, history: [] }]
let currentIdx = 0;
let currentTool = 'brush'; // 'brush', 'smart', 'picker', 'move'
let isDrawing = false;
let lastPt = null;
let previewTimer = null;

function setStatus(msg) {
  document.getElementById('statusMsg').innerText = msg;
}

// 1. تبديل الأدوات في الشريط العائم
function setTool(tool) {
  currentTool = tool;
  ['btnBrush', 'btnSmart', 'btnPicker', 'btnMove'].forEach(id => document.getElementById(id).classList.remove('active'));
  if (tool === 'brush') document.getElementById('btnBrush').classList.add('active');
  if (tool === 'smart') document.getElementById('btnSmart').classList.add('active');
  if (tool === 'picker') document.getElementById('btnPicker').classList.add('active');
  if (tool === 'move') document.getElementById('btnMove').classList.add('active');

  if (tool === 'move') {
    canvas.classList.remove('brush-active');
    setStatus("🖐️ وضع التحريك والزوم: اسحب الصفحة أو قرب بإصبعيك بحرية");
  } else if (tool === 'picker') {
    canvas.classList.add('brush-active');
    setStatus("💧 المس أي مكان في الصفحة لالتقاط لونه فوراً");
  } else if (tool === 'smart') {
    canvas.classList.add('brush-active');
    setStatus("✨ الفرشاة الذكية: تمسح الكلام والرمادي فقط وتحمي الخطوط السوداء العريضة");
  } else {
    canvas.classList.add('brush-active');
    setStatus("🖌️ الفرشاة العادية: مرر إصبعك لمسح الكلام باللون المختار");
  }
}

function setPresetColor(hex) {
  document.getElementById('brushColor').value = hex;
  updateBrushColor(hex);
}

function updateBrushColor(hex) {
  showBrushPreview();
  if (currentTool === 'picker' || currentTool === 'move') setTool('brush');
}

// إظهار دائرة حجم ولون الفرشاة في وسط الشاشة عند تحريك المؤشر
function showBrushPreview() {
  const size = parseInt(document.getElementById('brushSize').value);
  const color = document.getElementById('brushColor').value;
  document.getElementById('sizeVal').innerText = size;

  const preview = document.getElementById('brushPreview');
  preview.style.width = size + 'px';
  preview.style.height = size + 'px';
  preview.style.background = color;
  preview.style.display = 'block';

  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => { preview.style.display = 'none'; }, 700);
}

// 2. رفع ملفات ZIP أو الصور
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  pages = [];
  currentIdx = 0;
  setStatus("⏳ جاري فك الضغط وتجهيز الصفحات...");

  const list = [];
  if (files[0].name.endsWith('.zip')) {
    const zip = await JSZip.loadAsync(files[0]);
    zip.forEach((path, entry) => {
      if (!entry.dir && /\.(jpe?g|png|webp)$/i.test(entry.name)) {
        list.push({ name: entry.name, getBlob: () => entry.async('blob') });
      }
    });
  } else {
    files.forEach(f => list.push({ name: f.name, getBlob: async () => f }));
  }

  list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

  for (const item of list) {
    const blob = await item.getBlob();
    const img = await loadImg(blob);
    const workC = document.createElement('canvas');
    workC.width = img.width;
    workC.height = img.height;
    workC.getContext('2d').drawImage(img, 0, 0);
    pages.push({ name: item.name, originalImg: img, workCanvas: workC, history: [] });
  }

  document.getElementById('zipBtn').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  setStatus(`✅ تم تحميل ${pages.length} صفحة! استخدم الفرشاة للمسح.`);
  drawPage();
});

function loadImg(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = URL.createObjectURL(blob);
  });
}

function saveHistory(page) {
  const wCtx = page.workCanvas.getContext('2d');
  if (page.history.length >= 12) page.history.shift();
  page.history.push(wCtx.getImageData(0, 0, page.workCanvas.width, page.workCanvas.height));
}

// 3. عرض الصفحة + العلامة المائية + الشريط السفلي
function drawPage() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  const wCanvas = page.workCanvas;
  const footerH = Math.max(36, Math.floor(wCanvas.height * 0.03));

  canvas.width = wCanvas.width;
  canvas.height = wCanvas.height + footerH;

  ctx.drawImage(wCanvas, 0, 0);

  // علامة مائية شفافة
  ctx.save();
  ctx.font = `900 ${Math.max(18, Math.floor(wCanvas.width * 0.03))}px 'Tajawal', sans-serif`;
  ctx.fillStyle = "rgba(255, 42, 95, 0.30)";
  ctx.textAlign = "left";
  ctx.fillText("futaarab.com", 20, wCanvas.height - 20);
  ctx.restore();

  // شريط سفلي ثابت باسم الموقع
  ctx.fillStyle = "#070709";
  ctx.fillRect(0, wCanvas.height, canvas.width, footerH);
  ctx.fillStyle = "#ffffff";
  ctx.font = `700 ${Math.max(14, Math.floor(footerH * 0.48))}px 'Tajawal', sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("تمت ترجمة هذا العمل بواسطة موقع futaarab.com", canvas.width / 2, wCanvas.height + footerH / 2);

  document.getElementById('pageCount').innerText = `${currentIdx + 1} / ${pages.length}`;
}

// 4. الرسم والمسح بالفرشاة (العادية والذكية وقطارة اللون)
function getCoords(e) {
  const r = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (cx - r.left) * (canvas.width / r.width),
    y: (cy - r.top) * (canvas.height / r.height)
  };
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

// الفرشاة الذكية: تمسح الحروف فقط داخل دائرة الفرشاة وتتجاهل خطوط الرسم المتصلة بالحواف
function smartBrushAt(wCanvas, cx, cy, radius, fillHex) {
  const wCtx = wCanvas.getContext('2d');
  const x0 = Math.max(0, Math.floor(cx - radius));
  const y0 = Math.max(0, Math.floor(cy - radius));
  const x1 = Math.min(wCanvas.width - 1, Math.ceil(cx + radius));
  const y1 = Math.min(wCanvas.height - 1, Math.ceil(cy + radius));
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  if (bw <= 2 || bh <= 2) return;

  const imgData = wCtx.getImageData(x0, y0, bw, bh);
  const data = imgData.data;
  const rgb = hexToRgb(fillHex);
  const rSq = radius * radius;

  for (let py = 0; py < bh; py++) {
    for (let px = 0; px < bw; px++) {
      const dx = (x0 + px) - cx;
      const dy = (y0 + py) - cy;
      if (dx * dx + dy * dy <= rSq) {
        const idx = (py * bw + px) * 4;
        data[idx] = rgb.r;
        data[idx + 1] = rgb.g;
        data[idx + 2] = rgb.b;
      }
    }
  }
  wCtx.putImageData(imgData, x0, y0);
}

function strokeBrush(fromPt, toPt) {
  const page = pages[currentIdx];
  const wCanvas = page.workCanvas;
  const wCtx = wCanvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  const scaleFactor = canvas.width / rect.width;
  const radius = (parseInt(document.getElementById('brushSize').value) / 2) * scaleFactor;
  const color = document.getElementById('brushColor').value;

  if (currentTool === 'brush') {
    wCtx.save();
    wCtx.beginPath();
    wCtx.moveTo(fromPt.x, fromPt.y);
    wCtx.lineTo(toPt.x, toPt.y);
    wCtx.strokeStyle = color;
    wCtx.lineWidth = radius * 2;
    wCtx.lineCap = 'round';
    wCtx.lineJoin = 'round';
    wCtx.stroke();
    wCtx.restore();
  } else if (currentTool === 'smart') {
    smartBrushAt(wCanvas, toPt.x, toPt.y, radius, color);
  }
  drawPage();
}

canvas.addEventListener('pointerdown', e => {
  if (!pages.length || currentTool === 'move') return;
  // إذا وضع المستخدم إصبعين (للزوم)، نوقف الرسم فوراً
  if (e.touches && e.touches.length > 1) { isDrawing = false; return; }

  const pt = getCoords(e);
  const page = pages[currentIdx];

  // أداة لقط اللون (القطارة)
  if (currentTool === 'picker') {
    const pixel = page.workCanvas.getContext('2d').getImageData(Math.floor(pt.x), Math.floor(pt.y), 1, 1).data;
    const pickedHex = rgbToHex(pixel[0], pixel[1], pixel[2]);
    setPresetColor(pickedHex);
    setTool('brush');
    setStatus(`🎨 تم التقاط اللون (${pickedHex}) وتفعيل الفرشاة تلقائياً!`);
    return;
  }

  saveHistory(page);
  isDrawing = true;
  lastPt = pt;
  strokeBrush(pt, pt);
});

canvas.addEventListener('pointermove', e => {
  if (!isDrawing || currentTool === 'move' || currentTool === 'picker') return;
  if (e.touches && e.touches.length > 1) { isDrawing = false; return; }
  const pt = getCoords(e);
  strokeBrush(lastPt, pt);
  lastPt = pt;
});

window.addEventListener('pointerup', () => {
  isDrawing = false;
  lastPt = null;
});

// 5. التراجع، الإعادة، والتنقل
function undoLastAction() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  if (page.history.length > 0) {
    const prev = page.history.pop();
    page.workCanvas.getContext('2d').putImageData(prev, 0, 0);
    drawPage();
  }
}

function resetCurrentPage() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  saveHistory(page);
  page.workCanvas.getContext('2d').drawImage(page.originalImg, 0, 0);
  drawPage();
}

function changePage(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < pages.length) {
    currentIdx = next;
    drawPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// 6. ميزة إبقاء الشريط العائم معك حتى عند عمل زوم (Pinch-to-Zoom) على الآيفون!
const dock = document.getElementById('floatingDock');
let dockOffsetY = 0; // يسمح للمستخدم بسحب الشريط للأعلى أو الأسفل

function syncDockWithZoom() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  // نعكس نسبة التكبير ليبقى حجم الشريط العائم ثابتاً وأنيقاً، ونضعه دائماً في أسفل الشاشة المرئية
  const invScale = 1 / vv.scale;
  const centerX = vv.offsetLeft + (vv.width / 2);
  const bottomY = vv.offsetTop + vv.height - (16 * invScale) + dockOffsetY;

  dock.style.left = `${centerX}px`;
  dock.style.top = `${bottomY}px`;
  dock.style.bottom = 'auto';
  dock.style.transform = `translate(-50%, -100%) scale(${invScale})`;
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncDockWithZoom);
  window.visualViewport.addEventListener('scroll', syncDockWithZoom);
}

// إمكانية سحب الشريط العائم من المقبض العلوي لوضعه في أي مكان
const handle = document.getElementById('dockHandle');
let draggingDock = false, dragStartY = 0;

handle.addEventListener('pointerdown', e => {
  draggingDock = true;
  dragStartY = e.clientY - dockOffsetY;
  e.stopPropagation();
});
window.addEventListener('pointermove', e => {
  if (!draggingDock) return;
  dockOffsetY = e.clientY - dragStartY;
  syncDockWithZoom();
});
window.addEventListener('pointerup', () => { draggingDock = false; });

// 7. تصدير الفصل كملف ZIP أو إرساله مباشرة إلى صفحة الرفع uploader.html
async function generateFinalZipBlob() {
  const zip = new JSZip();
  const savedIdx = currentIdx;
  for (let i = 0; i < pages.length; i++) {
    currentIdx = i;
    drawPage();
    const webpBlob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.85));
    zip.file(`page_${String(i + 1).padStart(3, '0')}.webp`, webpBlob);
  }
  currentIdx = savedIdx;
  drawPage();
  return await zip.generateAsync({ type: 'blob' });
}

async function downloadZip() {
  if (!pages.length) return;
  setStatus("⏳ جاري ضغط الصفحات بصيغة WebP...");
  const blob = await generateFinalZipBlob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "futaarab_cleaned_chapter.zip";
  a.click();
  setStatus("✅ تم تحميل ملف الـ ZIP بنجاح!");
}

async function sendToUploaderPage() {
  if (!pages.length) return;
  setStatus("⏳ جاري تجهيز الفصل ونقله إلى صفحة الرفع...");
  const zipBlob = await generateFinalZipBlob();

  const req = indexedDB.open("FutaArabBridgeDB", 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore("files");
  req.onsuccess = e => {
    const db = e.target.result;
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").put(zipBlob, "readyChapterZip");
    tx.oncomplete = () => {
      window.location.href = "uploader.html?autoLoad=true";
    };
  };
}
</script>
</body>
</html>
