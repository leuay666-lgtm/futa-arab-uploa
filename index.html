<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>استوديو التبييض الاحترافي - Futa Arab</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #060609;
      --bg-surface: #101017;
      --glass-bg: rgba(16, 16, 24, 0.92);
      --glass-border: rgba(255, 255, 255, 0.11);
      --accent: #ff2a5f;
      --accent-soft: rgba(255, 42, 95, 0.18);
      --accent-glow: rgba(255, 42, 95, 0.4);
      --purple: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #131122 0%, var(--bg-main) 45%);
      color: var(--text); min-height: 100vh; overflow-x: hidden;
      padding-bottom: 200px; overscroll-behavior: none;
    }

    /* هيدر Futa Arab الاحترافي */
    .futa-header {
      position: sticky; top: 0; z-index: 600;
      background: var(--glass-bg);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border);
      padding: 10px 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    .header-top {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 780px; margin: 0 auto;
    }

    .brand-wrap {
      display: flex; align-items: center; gap: 10px;
    }
    .brand-logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, var(--purple), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
    }
    .brand-title {
      font-weight: 900; font-size: 18px; letter-spacing: 0.3px;
      background: linear-gradient(90deg, #ff2a5f, #ff6b8b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .free-pill {
      background: rgba(255, 255, 255, 0.07); border: 1px solid var(--glass-border);
      color: #cbd5e1; font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
    }

    .header-actions {
      display: flex; gap: 6px; align-items: center;
    }
    .btn-action {
      padding: 7px 12px; border-radius: 10px; border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.06); color: var(--text);
      font-size: 12px; font-weight: 800; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px; transition: 0.18s;
    }
    .btn-action:active { transform: scale(0.94); }
    .btn-action.primary {
      background: linear-gradient(135deg, var(--accent), #e11d48);
      border-color: transparent; box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-action.success {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: transparent; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .btn-action.danger {
      background: rgba(239, 68, 68, 0.14); border-color: rgba(239, 68, 68, 0.35); color: #fca5a5;
    }
    .btn-action:disabled { opacity: 0.35; pointer-events: none; }

    /* شريط حالة العمل تحت الهيدر */
    .chapter-banner {
      max-width: 780px; margin: 10px auto 6px; padding: 8px 12px;
      background: rgba(18, 18, 28, 0.8); border: 1px solid var(--glass-border);
      border-radius: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .status-text {
      font-size: 12px; font-weight: 700; color: #fbbf24; line-height: 1.4;
    }
    .zoom-pill {
      background: var(--accent-soft); border: 1px solid var(--accent);
      color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px;
      border-radius: 20px; cursor: pointer; white-space: nowrap; display: none;
    }

    /* منطقة الصفحة والـ Canvas */
    .workspace {
      width: 100%; max-width: 780px; margin: 6px auto; padding: 0 8px; position: relative;
    }
    .viewport-box {
      position: relative; width: 100%; min-height: 390px;
      border-radius: 16px; overflow: hidden;
      background: #0b0b10;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.85);
      touch-action: none;
      display: flex; align-items: center; justify-content: center;
    }
    .canvas-stage {
      position: relative; width: 100%; transform-origin: 0 0; will-change: transform;
    }
    canvas { width: 100%; height: auto; display: block; pointer-events: none; }

    /* خط المقارنة (Before / After) */
    #compareOverlay {
      position: absolute; inset: 0; pointer-events: none; display: none; z-index: 35;
    }
    #compareOverlay.active { display: block; }
    #beforeCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    #compareSlider {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 48px;
      transform: translateX(-50%); pointer-events: auto; cursor: ew-resize;
      display: flex; align-items: center; justify-content: center; touch-action: none;
    }
    .compare-line {
      width: 2.5px; height: 100%; background: #ffffff;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.95);
    }
    .compare-knob {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 36px; height: 36px; border-radius: 50%;
      background: #ffffff; color: #09090d; font-weight: 900; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.75); border: 2.5px solid var(--accent);
    }
    .compare-label {
      position: absolute; top: 12px; padding: 4px 10px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.78); color: #fff; font-size: 11px; font-weight: 800;
      border: 1px solid rgba(255,255,255,0.18); pointer-events: none;
    }
    .label-orig { left: 12px; }
    .label-edit { right: 12px; color: #ff6b8b; }

    /* عدسة القطارة المتحركة (Eyedropper Loupe) */
    #pickerLoupe {
      position: fixed; width: 78px; height: 78px; border-radius: 50%;
      border: 3px solid #ffffff; box-shadow: 0 8px 25px rgba(0,0,0,0.85), 0 0 0 2px var(--accent);
      pointer-events: none; z-index: 9999; display: none;
      transform: translate(-50%, -125%);
      align-items: flex-end; justify-content: center; padding-bottom: 6px;
    }
    #pickerLoupe span {
      background: rgba(0,0,0,0.82); color: #fff; font-size: 10px; font-weight: 900;
      padding: 2px 6px; border-radius: 6px; direction: ltr;
    }
    #pickerLoupe::after {
      content: ''; position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
      border-width: 8px 6px 0; border-style: solid; border-color: #ffffff transparent;
    }

    /* مؤشر تصويب الدلو المتحرك (Bucket Target) */
    #bucketTarget {
      position: fixed; width: 44px; height: 44px; border-radius: 50%;
      border: 2.5px dashed var(--accent); background: rgba(255, 42, 95, 0.18);
      box-shadow: 0 0 18px var(--accent-glow);
      pointer-events: none; z-index: 9999; display: none;
      transform: translate(-50%, -50%);
      align-items: center; justify-content: center; font-size: 18px;
    }
    #bucketTarget::before {
      content: '+'; color: #fff; font-weight: 900; font-size: 20px; text-shadow: 0 0 4px #000;
    }

    /* دائرة معاينة حجم الفرشاة */
    #brushPreview {
      position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
      border-radius: 50%; border: 2px solid var(--accent); pointer-events: none;
      z-index: 9999; display: none; box-shadow: 0 0 18px rgba(0,0,0,0.75);
    }

    /* كبسولة التنقل بين الصفحات أسفل الصفحة (Futa Arab Pill) */
    .pager-pill {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin: 12px auto 4px; width: fit-content;
      background: rgba(16, 16, 24, 0.95); border: 1px solid var(--glass-border);
      padding: 7px 18px; border-radius: 999px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7);
    }
    .pager-arrow {
      background: rgba(255,255,255,0.06); border: none; color: var(--text);
      width: 28px; height: 28px; border-radius: 50%; font-size: 13px; font-weight: 900;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .pager-arrow:active { background: var(--accent); }
    .pager-numbers {
      font-size: 14px; font-weight: 900; color: var(--text); min-width: 72px; text-align: center;
      direction: ltr;
    }
    .pager-numbers b { color: var(--accent); }

    /* الشريط العائم السفلي لأدوات IbisPaint */
    #floatingDock {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
      z-index: 900; width: 96%; max-width: 500px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px; padding: 10px 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.92), 0 0 0 1px rgba(255, 42, 95, 0.18);
    }
    .dock-row { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
    .dock-row + .dock-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); }

    .tool-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 7px 2px; border-radius: 13px; border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.04); color: var(--muted);
      font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.15s;
    }
    .tool-btn span.icon { font-size: 16px; line-height: 1.1; }
    .tool-btn.active {
      background: var(--accent-soft); color: #ffffff;
      border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow);
      transform: translateY(-1px);
    }

    .color-picker-wrap {
      position: relative; width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid #fff; overflow: hidden; flex-shrink: 0;
    }
    .color-picker-wrap input[type="color"] {
      position: absolute; top: -10px; left: -10px; width: 52px; height: 52px;
      border: none; cursor: pointer; background: none;
    }
    .preset-colors { display: flex; gap: 5px; align-items: center; }
    .color-dot {
      width: 21px; height: 21px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.5); cursor: pointer;
    }
    .size-slider { flex: 1; accent-color: var(--accent); height: 6px; border-radius: 4px; }

    /* زر المربع الرقمي للطبقات/الصفحات بأسلوب IbisPaint */
    .layers-square-btn {
      width: 34px; height: 34px; border-radius: 8px;
      background: rgba(255,255,255,0.08); border: 1.5px solid #ffffff;
      color: #ffffff; font-weight: 900; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      box-shadow: 3px 3px 0 var(--accent);
    }

    /* نافذة اختيار الصفحات السريعة */
    #pagesModal {
      position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.82);
      backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #pagesModal.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 440px; max-height: 80vh; background: var(--bg-surface);
      border: 1px solid var(--glass-border); border-radius: 20px; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .pages-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow-y: auto; padding: 4px;
    }
    .page-card {
      background: rgba(255,255,255,0.05); border: 1.5px solid transparent; border-radius: 12px;
      padding: 10px 6px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 800;
    }
    .page-card.current { border-color: var(--accent); background: var(--accent-soft); color: #fff; }
  </style>
</head>
<body>

  <!-- الهيدر العلوي بتصميم Futa Arab -->
  <header class="futa-header">
    <div class="header-top">
      <div class="brand-wrap">
        <div class="brand-logo">🎲</div>
        <span class="brand-title">Futa Arab</span>
        <span class="free-pill">استوديو التبييض</span>
      </div>
      <div class="header-actions">
        <label class="btn-action primary" for="fileInput">📁 رفع فصل</label>
        <input type="file" id="fileInput" accept=".zip,image/*" multiple style="display:none;">
        <button class="btn-action" id="zipBtn" onclick="downloadZip()" disabled>📦 ZIP</button>
        <button class="btn-action success" id="sendBtn" onclick="sendToUploaderPage()" disabled>🚀 للنشر</button>
        <button class="btn-action danger" id="clearSessionBtn" onclick="clearSavedSession()" style="display:none;" title="حذف الجلسة المحفوظة">🗑️</button>
      </div>
    </div>
  </header>

  <!-- شريط الإرشادات وحالة الزوم -->
  <div class="chapter-banner">
    <div class="status-text" id="statusMsg">ارفع ملف ZIP أو صور المانغا للبدء (اضغط مرتين للزوم، واضغط على الأداة مجدداً لإلغاء تحديدها)...</div>
    <button class="zoom-pill" id="resetZoomBtn" onclick="resetZoom()">🔍 100%</button>
  </div>

  <!-- مساحة العمل والكانفاس -->
  <div class="workspace">
    <div class="viewport-box" id="viewportBox">
      <div class="canvas-stage" id="canvasStage">
        <canvas id="pageCanvas"></canvas>

        <!-- طبقة المقارنة (Before / After) -->
        <div id="compareOverlay">
          <canvas id="beforeCanvas"></canvas>
          <span class="compare-label label-orig">الأصلية</span>
          <span class="compare-label label-edit">المعدلة</span>
          <div id="compareSlider">
            <div class="compare-line"></div>
            <div class="compare-knob">↔</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- كبسولة التنقل بين الصفحات (كما في صورة Futa Arab) -->
  <div class="pager-pill">
    <button class="pager-arrow" onclick="changePage(-1)" title="السابقة">❮</button>
    <div class="pager-numbers" id="pageCount">0 / <b>0</b></div>
    <button class="pager-arrow" onclick="changePage(1)" title="التالية">❯</button>
  </div>

  <!-- عدسة القطارة المتحركة + مؤشر الدلو + معاينة الفرشاة -->
  <div id="pickerLoupe"><span id="pickerHexText">#FFFFFF</span></div>
  <div id="bucketTarget"></div>
  <div id="brushPreview"></div>

  <!-- نافذة قائمة الصفحات -->
  <div id="pagesModal" onclick="if(event.target===this) togglePagesModal()">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color:var(--accent);">📑 الانتقال السريع بين الصفحات</strong>
        <button class="btn-action" onclick="togglePagesModal()">إغلاق ✕</button>
      </div>
      <div class="pages-grid" id="pagesGrid"></div>
    </div>
  </div>

  <!-- الشريط العائم لأدوات IbisPaint -->
  <div id="floatingDock">
    <div class="dock-row">
      <button class="tool-btn active" id="btnBrush" onclick="toggleTool('brush')">
        <span class="icon">🖌️</span><span>فرشاة</span>
      </button>
      <button class="tool-btn" id="btnSmart" onclick="toggleTool('smart')">
        <span class="icon">✨</span><span>ذكية</span>
      </button>
      <button class="tool-btn" id="btnEraser" onclick="toggleTool('eraser')">
        <span class="icon">🧽</span><span>ممحاة</span>
      </button>
      <button class="tool-btn" id="btnBlur" onclick="toggleTool('blur')">
        <span class="icon">💧</span><span>تمويه</span>
      </button>
      <button class="tool-btn" id="btnBucket" onclick="toggleTool('bucket')">
        <span class="icon">🪣</span><span>دلو</span>
      </button>
      <button class="tool-btn" id="btnPicker" onclick="toggleTool('picker')">
        <span class="icon">💉</span><span>قطارة</span>
      </button>
      <button class="tool-btn" id="btnCompare" onclick="toggleCompareMode()">
        <span class="icon">🌗</span><span>مقارنة</span>
      </button>
      <button class="tool-btn" onclick="undoLastAction()">
        <span class="icon">↩️</span><span>تراجع</span>
      </button>
    </div>

    <div class="dock-row">
      <div class="color-picker-wrap" title="لون الفرشاة والدلو">
        <input type="color" id="brushColor" value="#ffffff" onchange="updateBrushColor(this.value)">
      </div>
      <div class="preset-colors">
        <div class="color-dot" style="background:#ffffff;" onclick="setPresetColor('#ffffff')" title="أبيض"></div>
        <div class="color-dot" style="background:#000000;" onclick="setPresetColor('#000000')" title="أسود"></div>
      </div>

      <input type="range" class="size-slider" id="brushSize" min="4" max="120" value="32" oninput="showBrushPreview()">
      <span id="sizeVal" style="font-size:11px; font-weight:900; min-width:24px; text-align:center;">32</span>

      <button class="btn-action" style="padding:6px 8px;" onclick="resetCurrentPage()" title="استرجاع الصفحة الأصلية">🔄</button>
      <div class="layers-square-btn" id="layerSquareBtn" onclick="togglePagesModal()" title="كل الصفحات">1</div>
    </div>
  </div>

<script>
const canvas = document.getElementById('pageCanvas');
const ctx = canvas.getElementById('pageCanvas').getContext('2d', { willReadFrequently: true });
const beforeCanvas = document.getElementById('beforeCanvas');
const beforeCtx = beforeCanvas.getContext('2d');
const viewportBox = document.getElementById('viewportBox');
const canvasStage = document.getElementById('canvasStage');
const compareOverlay = document.getElementById('compareOverlay');
const compareSlider = document.getElementById('compareSlider');
const pickerLoupe = document.getElementById('pickerLoupe');
const pickerHexText = document.getElementById('pickerHexText');
const bucketTarget = document.getElementById('bucketTarget');

let pages = []; // [{ name, originalImg, workCanvas, history: [] }]
let currentIdx = 0;
let currentTool = 'brush'; // 'brush', 'smart', 'eraser', 'blur', 'bucket', 'picker', or null (عند إلغاء التحديد)
let isCompareMode = false;
let compareSplitPercent = 50;

// متغيرات الرسم، القطارة، الدلو، والتحريك
let isDrawing = false;
let isAimingBucket = false;
let isAimingPicker = false;
let isSingleFingerPan = false;
let isTwoFingerGesture = false;

let activePt = null;
let pickedHexLive = "#ffffff";
let lastPt = null;
let strokeSnapshot = null;
let strokeStartTime = 0;
let previewTimer = null;
let saveTimer = null;

// متغيرات الزوم والتحريك والضغط المزدوج (Double-Tap)
let viewScale = 1;
let viewX = 0;
let viewY = 0;
let pinchStartDist = 0;
let pinchStartScale = 1;
let panStartMid = { x: 0, y: 0 };
let panStartOffset = { x: 0, y: 0 };
let lastTapTime = 0;
let lastTapPos = { x: 0, y: 0 };

function setStatus(msg) {
  document.getElementById('statusMsg').innerText = msg;
}

// ====================================================
// 1. نظام الحفظ التلقائي الفوري في IndexedDB ضد الريلود
// ====================================================
const DB_NAME = "FutaStudioAutoSaveDB";
const DB_VERSION = 1;

function openSessionDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("session")) {
        db.createObjectStore("session");
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

function scheduleAutoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrentPageToDB, 300);
}

async function saveCurrentPageToDB() {
  if (!pages.length) return;
  try {
    const page = pages[currentIdx];
    const workBlob = await new Promise(res => page.workCanvas.toBlob(res, 'image/webp', 0.92));
    const db = await openSessionDB();
    const tx = db.transaction("session", "readwrite");
    const store = tx.objectStore("session");
    store.put(workBlob, `work_${currentIdx}`);
    store.put(currentIdx, "currentIdx");
  } catch (err) {
    console.warn("AutoSave skipped:", err);
  }
}

async function saveFullProjectToDB() {
  if (!pages.length) return;
  try {
    const meta = pages.map(p => p.name);
    const origBlobs = await Promise.all(pages.map(p => new Promise(res => {
      const c = document.createElement('canvas');
      c.width = p.originalImg.width;
      c.height = p.originalImg.height;
      c.getContext('2d').drawImage(p.originalImg, 0, 0);
      c.toBlob(res, 'image/webp', 0.92);
    })));
    const workBlobs = await Promise.all(pages.map(p => new Promise(res => p.workCanvas.toBlob(res, 'image/webp', 0.92))));

    const db = await openSessionDB();
    const tx = db.transaction("session", "readwrite");
    const store = tx.objectStore("session");
    store.clear();
    store.put(meta, "pagesMeta");
    store.put(currentIdx, "currentIdx");
    origBlobs.forEach((b, i) => store.put(b, `orig_${i}`));
    workBlobs.forEach((b, i) => store.put(b, `work_${i}`));
    document.getElementById('clearSessionBtn').style.display = 'inline-flex';
  } catch (err) {
    console.warn("Full session save error:", err);
  }
}

async function restoreSessionOnLoad() {
  try {
    const db = await openSessionDB();
    const getVal = key => new Promise(res => {
      const req = db.transaction("session", "readonly").objectStore("session").get(key);
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    });

    const meta = await getVal("pagesMeta");
    if (!meta || !meta.length) return;

    setStatus("⏳ جاري استرجاع آخر جلسة عمل تلقائياً...");
    pages = [];
    for (let i = 0; i < meta.length; i++) {
      const origBlob = await getVal(`orig_${i}`);
      const workBlob = await getVal(`work_${i}`);
      if (!origBlob) continue;
      const origImg = await loadImg(origBlob);
      const workC = document.createElement('canvas');
      workC.width = origImg.width;
      workC.height = origImg.height;
      if (workBlob) {
        const workImg = await loadImg(workBlob);
        workC.getContext('2d').drawImage(workImg, 0, 0);
      } else {
        workC.getContext('2d').drawImage(origImg, 0, 0);
      }
      pages.push({ name: meta[i], originalImg: origImg, workCanvas: workC, history: [] });
    }

    if (pages.length > 0) {
      const savedIdx = await getVal("currentIdx");
      currentIdx = (typeof savedIdx === 'number' && savedIdx < pages.length) ? savedIdx : 0;
      document.getElementById('zipBtn').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('clearSessionBtn').style.display = 'inline-flex';
      drawPage();
      setStatus(`✅ تم استرجاع عملك السابق تلقائياً (صفحة ${currentIdx + 1} من ${pages.length})`);
    }
  } catch (err) {
    console.warn("Restore session error:", err);
  }
}

async function clearSavedSession() {
  if (!confirm("هل تريد مسح الجلسة المحفوظة والبدء بفصل جديد؟")) return;
  const db = await openSessionDB();
  const tx = db.transaction("session", "readwrite");
  tx.objectStore("session").clear();
  pages = [];
  currentIdx = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('pageCount').innerHTML = "0 / <b>0</b>";
  document.getElementById('layerSquareBtn').innerText = "0";
  document.getElementById('zipBtn').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('clearSessionBtn').style.display = 'none';
  setStatus("🗑️ تم مسح الجلسة المحفوظة. ارفع فصلاً جديداً للبدء.");
}

};

function toggleTool(tool) {

  if (currentTool === tool) {
    currentTool = null;

  setTool(tool);
}

    brush: '🖌️ الفرشاة العادية: امسح بإصبع واحد، أو اضغط مرتين للتكبير/التصغير',

    blur: '💧 التمويه (Blur): لتنعيم ودمج التدرجات اللونية بسلاسة',
    bucket: '🪣 دلو الفقاعات الذكي: حرك إصبعك داخل الفقاعة ثم ارفع يدك لتبييضها من الكتابة فوراً!',
    picker: '💉 القطارة المتحركة: اسحب إصبعك لاختيار اللون، وارفع يدك لاعتماده!'

function setPresetColor(hex) {
  document.getElementById('brushColor').value = hex;
  updateBrushColor(hex);
}

function updateBrushColor(hex) {

  if (currentTool === 'picker' || currentTool === 'eraser' || currentTool === 'blur') {
    setTool('brush');

function showBrushPreview() {

  document.getElementById('sizeVal').innerText = size;

// ====================================================
// 3. رفع ملفات ZIP أو الصور
// ====================================================
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  pages = [];
  currentIdx = 0;
  setStatus("⏳ جاري فك الضغط وتجهيز الصفحات...");

  const list = [];
  if (files[0].name.toLowerCase().endsWith('.zip')) {
    const zip = await JSZip.loadAsync(files[0]);
    zip.forEach((path, entry) => {
      if (!entry.dir && /\.(jpe?g|png|webp)$/i.test(entry.name)) {
        list.push({ name: entry.name, getBlob: () => entry.async('blob') });
      }
    });
  } else {
    files.forEach(f => list.push({ name: f.name, getBlob: async () => f }));
  }

  list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

  for (const item of list) {
    const blob = await item.getBlob();
    const img = await loadImg(blob);
    const workC = document.createElement('canvas');
    workC.width = img.width;
    workC.height = img.height;
    workC.getContext('2d').drawImage(img, 0, 0);
    pages.push({ name: item.name, originalImg: img, workCanvas: workC, history: [] });
  }

  document.getElementById('zipBtn').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  resetZoom();
  drawPage();
  setStatus(`✅ تم تحميل ${pages.length} صفحة وحفظها تلقائياً!`);
  await saveFullProjectToDB();
});

function loadImg(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(img.src);
      res(img);
    };
    img.src = URL.createObjectURL(blob);
  });
}

function saveHistory(page) {
  const wCtx = page.workCanvas.getContext('2d');
  if (page.history.length >= 12) page.history.shift();
  page.history.push(wCtx.getImageData(0, 0, page.workCanvas.width, page.workCanvas.height));
}

// ====================================================
// 4. عرض الصفحة + العلامة المائية + المقارنة
// ====================================================
function renderCompositeToContext(targetCtx, sourceDrawable, width, height) {
  const footerH = Math.max(36, Math.floor(height * 0.03));
  targetCtx.clearRect(0, 0, width, height + footerH);
  targetCtx.drawImage(sourceDrawable, 0, 0);

  // علامة مائية شفافة
  targetCtx.save();
  targetCtx.font = `900 ${Math.max(18, Math.floor(width * 0.03))}px 'Tajawal', sans-serif`;
  targetCtx.fillStyle = "rgba(255, 42, 95, 0.30)";
  targetCtx.textAlign = "left";
  targetCtx.fillText("futaarab.com", 20, height - 20);
  targetCtx.restore();

  // شريط سفلي ثابت باسم الموقع
  targetCtx.fillStyle = "#070709";
  targetCtx.fillRect(0, height, width, footerH);
  targetCtx.fillStyle = "#ffffff";
  targetCtx.font = `700 ${Math.max(14, Math.floor(footerH * 0.48))}px 'Tajawal', sans-serif`;
  targetCtx.textAlign = "center";
  targetCtx.textBaseline = "middle";
  targetCtx.fillText("تمت ترجمة هذا العمل بواسطة موقع futaarab.com", width / 2, height + footerH / 2);
}

function drawPage() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  const wCanvas = page.workCanvas;
  const footerH = Math.max(36, Math.floor(wCanvas.height * 0.03));
  const totalH = wCanvas.height + footerH;

  if (canvas.width !== wCanvas.width || canvas.height !== totalH) {
    canvas.width = wCanvas.width;
    canvas.height = totalH;
  }

  renderCompositeToContext(ctx, wCanvas, wCanvas.width, wCanvas.height);

  if (isCompareMode) {
    syncBeforeCanvas();
  }

  document.getElementById('pageCount').innerHTML = `${pages.length} / <b>${currentIdx + 1}</b>`;
  document.getElementById('layerSquareBtn').innerText = currentIdx + 1;
}

// ====================================================
// 5. خط المقارنة المتحرك (Before / After)
// ====================================================
function toggleCompareMode() {
  if (!pages.length) return;
  isCompareMode = !isCompareMode;
  const btn = document.getElementById('btnCompare');
  if (isCompareMode) {
    btn.classList.add('active');
    compareOverlay.classList.add('active');
    syncBeforeCanvas();
    updateCompareClip(compareSplitPercent);
    setStatus("🌗 وضع المقارنة: اسحب الخط الأبيض لرؤية الفرق بين الأصلية والمعدلة");
  } else {
    btn.classList.remove('active');
    compareOverlay.classList.remove('active');
    setStatus("🖌️ تم إغلاق المقارنة والعودة للرسم");
  }
}

function syncBeforeCanvas() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  const w = page.workCanvas.width;
  const h = page.workCanvas.height;
  const footerH = Math.max(36, Math.floor(h * 0.03));
  if (beforeCanvas.width !== w || beforeCanvas.height !== h + footerH) {
    beforeCanvas.width = w;
    beforeCanvas.height = h + footerH;
  }
  renderCompositeToContext(beforeCtx, page.originalImg, w, h);
}

function updateCompareClip(percent) {
  compareSplitPercent = Math.max(0, Math.min(100, percent));
  beforeCanvas.style.clipPath = `polygon(0 0, ${compareSplitPercent}% 0, ${compareSplitPercent}% 100%, 0 100%)`;
  compareSlider.style.left = `${compareSplitPercent}%`;
}

let draggingCompare = false;
compareSlider.addEventListener('pointerdown', e => {
  draggingCompare = true;
  compareSlider.setPointerCapture(e.pointerId);
  e.stopPropagation();
});
compareSlider.addEventListener('pointermove', e => {
  if (!draggingCompare) return;
  const rect = canvasStage.getBoundingClientRect();
  const pct = ((e.clientX - rect.left) / rect.width) * 100;
  updateCompareClip(pct);
  e.stopPropagation();
});
compareSlider.addEventListener('pointerup', e => {
  draggingCompare = false;
  e.stopPropagation();
});

// ====================================================
// 6. الخوارزميات: دلو تبييض الفقاعات الذكي + الفرشاة الذكية + التمويه
// ====================================================
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

// دلو تبييض الفقاعات الذكي: يتعرف على حدود الفقاعة ويمسح كل الكتابة بداخلها عند رفع الإصبع!
function cleanSpeechBubbleAt(wCanvas, rawX, rawY, fillHex) {
  const wCtx = wCanvas.getContext('2d');
  const w = wCanvas.width, h = wCanvas.height;
  let sx = Math.floor(rawX), sy = Math.floor(rawY);
  if (sx < 0 || sx >= w || sy < 0 || sy >= h) return;

  const imgData = wCtx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const fillRgb = hexToRgb(fillHex);

  // 1. إذا رفع المستخدم إصبعه فوق حرف أسود داخل الفقاعة، نبحث تلقائياً عن أقرب بكسل خلفية فاتح بجواره
  const getLum = (x, y) => {
    const p = (y * w + x) * 4;
    return (data[p] * 299 + data[p + 1] * 587 + data[p + 2] * 114) / 1000;
  };

  if (getLum(sx, sy) < 150) {
    let foundBg = false;
    for (let r = 1; r <= 28 && !foundBg; r++) {
      for (let dy = -r; dy <= r && !foundBg; dy++) {
        for (let dx = -r; dx <= r && !foundBg; dx++) {
          const nx = sx + dx, ny = sy + dy;
          if (nx >= 0 && nx < w && ny >= 0 && ny < h && getLum(nx, ny) > 195) {
            sx = nx; sy = ny;
            foundBg = true;
          }
        }
      }
    }
  }

  const seedPos = (sy * w + sx) * 4;
  const sr = data[seedPos], sg = data[seedPos + 1], sb = data[seedPos + 2];
  const tol = 52; // حساسية التقاط خلفية الفقاعة

  // 2. إيجاد مساحة الفقاعة المحيطة بالنص
  const maxBubblePixels = Math.floor(w * h * 0.28); // حماية من تسرب اللون إذا كانت الفقاعة مفتوحة
  const visitedBubble = new Uint8Array(w * h);
  const queue = new Int32Array(w * h);
  let head = 0, tail = 0;

  const startIdx = sy * w + sx;
  visitedBubble[startIdx] = 1;
  queue[tail++] = startIdx;

  let minX = sx, maxX = sx, minY = sy, maxY = sy;
  let leakedOut = false;

  while (head < tail) {
    if (tail > maxBubblePixels) {
      leakedOut = true;
      break;
    }
    const curr = queue[head++];
    const cx = curr % w;
    const cy = (curr / w) | 0;

    if (cx < minX) minX = cx;
    if (cx > maxX) maxX = cx;
    if (cy < minY) minY = cy;
    if (cy > maxY) maxY = cy;

    // الجيران الأربعة
    const neighbors = [
      cx > 0 ? curr - 1 : -1,
      cx < w - 1 ? curr + 1 : -1,
      cy > 0 ? curr - w : -1,
      cy < h - 1 ? curr + w : -1
    ];

    for (let n = 0; n < 4; n++) {
      const ni = neighbors[n];
      if (ni !== -1 && !visitedBubble[ni]) {
        const np = ni * 4;
        if (
          Math.abs(data[np] - sr) <= tol &&
          Math.abs(data[np + 1] - sg) <= tol &&
          Math.abs(data[np + 2] - sb) <= tol
        ) {
          visitedBubble[ni] = 1;
          queue[tail++] = ni;
        }
      }
    }
  }

  // إذا كانت الفقاعة مفتوحة جداً أو نصاً بدون فقاعة، ننظف دائرة ذكية حول مكان الإصبع
  if (leakedOut || tail < 40) {
    const fallbackRadius = Math.max(45, parseInt(document.getElementById('brushSize').value) * 1.4);
    smartBrushAt(wCanvas, rawX, rawY, fallbackRadius, fillHex);
    return;
  }

  // 3. مسح جميع الحروف والكتابة المحصورة داخل الفقاعة مع الحفاظ التام على حدود الفقاعة الخارجية!
  const padMinX = Math.max(0, minX - 2);
  const padMaxX = Math.min(w - 1, maxX + 2);
  const padMinY = Math.max(0, minY - 2);
  const padMaxY = Math.min(h - 1, maxY + 2);
  const bw = padMaxX - padMinX + 1;
  const bh = padMaxY - padMinY + 1;

  // نحدد كل البكسلات الواقعة خارج الفقاعة بدءاً من حواف المربع المحيط
  const outsideBubble = new Uint8Array(bw * bh);
  const extQueue = new Int32Array(bw * bh);
  let eHead = 0, eTail = 0;

  for (let bx = 0; bx < bw; bx++) {
    const topGlobal = padMinY * w + (padMinX + bx);
    if (!visitedBubble[topGlobal]) {
      outsideBubble[bx] = 1;
      extQueue[eTail++] = bx;
    }
    const botLocal = (bh - 1) * bw + bx;
    const botGlobal = padMaxY * w + (padMinX + bx);
    if (!visitedBubble[botGlobal] && !outsideBubble[botLocal]) {
      outsideBubble[botLocal] = 1;
      extQueue[eTail++] = botLocal;
    }
  }

  for (let by = 1; by < bh - 1; by++) {
    const leftLocal = by * bw;
    const leftGlobal = (padMinY + by) * w + padMinX;
    if (!visitedBubble[leftGlobal] && !outsideBubble[leftLocal]) {
      outsideBubble[leftLocal] = 1;
      extQueue[eTail++] = leftLocal;
    }
    const rightLocal = by * bw + (bw - 1);
    const rightGlobal = (padMinY + by) * w + padMaxX;
    if (!visitedBubble[rightGlobal] && !outsideBubble[rightLocal]) {
      outsideBubble[rightLocal] = 1;
      extQueue[eTail++] = rightLocal;
    }
  }

  while (eHead < eTail) {
    const currLocal = extQueue[eHead++];
    const lx = currLocal % bw;
    const ly = (currLocal / bw) | 0;

    const lNeighbors = [
      lx > 0 ? currLocal - 1 : -1,
      lx < bw - 1 ? currLocal + 1 : -1,
      ly > 0 ? currLocal - bw : -1,
      ly < bh - 1 ? currLocal + bw : -1
    ];

    for (let n = 0; n < 4; n++) {
      const nl = lNeighbors[n];
      if (nl !== -1 && !outsideBubble[nl]) {
        const gx = padMinX + (nl % bw);
        const gy = padMinY + ((nl / bw) | 0);
        if (!visitedBubble[gy * w + gx]) {
          outsideBubble[nl] = 1;
          extQueue[eTail++] = nl;
        }
      }
    }
  }

  // تلوين الفقاعة بالكامل + مسح كل الحروف المحصورة بداخلها!
  for (let by = 0; by < bh; by++) {
    const gy = padMinY + by;
    for (let bx = 0; bx < bw; bx++) {
      const localIdx = by * bw + bx;
      if (!outsideBubble[localIdx]) {
        const gx = padMinX + bx;
        const p = (gy * w + gx) * 4;
        data[p] = fillRgb.r;
        data[p + 1] = fillRgb.g;
        data[p + 2] = fillRgb.b;
        data[p + 3] = 255;
      }
    }
  }

  wCtx.putImageData(imgData, 0, 0);
}

// الفرشاة الذكية: تمسح الحروف فقط داخل دائرة الفرشاة وتحمي خطوط الرسم المتصلة بالحواف
function smartBrushAt(wCanvas, cx, cy, radius, fillHex) {
  const wCtx = wCanvas.getContext('2d');
  const x0 = Math.max(0, Math.floor(cx - radius));
  const y0 = Math.max(0, Math.floor(cy - radius));
  const x1 = Math.min(wCanvas.width - 1, Math.ceil(cx + radius));
  const y1 = Math.min(wCanvas.height - 1, Math.ceil(cy + radius));
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  if (bw <= 2 || bh <= 2) return;

  const imgData = wCtx.getImageData(x0, y0, bw, bh);
  const data = imgData.data;
  const rgb = hexToRgb(fillHex);
  const rSq = radius * radius;

  const isDark = new Uint8Array(bw * bh);
  const protectedDark = new Uint8Array(bw * bh);
  const queue = new Int32Array(bw * bh);
  let qHead = 0, qTail = 0;

  for (let py = 0; py < bh; py++) {
    for (let px = 0; px < bw; px++) {
      const i = py * bw + px;
      const idx = i * 4;
      const lum = (data[idx] * 299 + data[idx + 1] * 587 + data[idx + 2] * 114) / 1000;
      if (lum < 95) {
        isDark[i] = 1;
        if (px === 0 || py === 0 || px === bw - 1 || py === bh - 1) {
          protectedDark[i] = 1;
          queue[qTail++] = i;
        }
      }
    }
  }

  while (qHead < qTail) {
    const curr = queue[qHead++];
    const cxIdx = curr % bw;
    const cyIdx = (curr / bw) | 0;
    const neighbors = [
      cyIdx > 0 ? curr - bw : -1,
      cyIdx < bh - 1 ? curr + bw : -1,
      cxIdx > 0 ? curr - 1 : -1,
      cxIdx < bw - 1 ? curr + 1 : -1
    ];
    for (let n of neighbors) {
      if (n !== -1 && isDark[n] && !protectedDark[n]) {
        protectedDark[n] = 1;
        queue[qTail++] = n;
      }
    }
  }

  for (let py = 0; py < bh; py++) {
    for (let px = 0; px < bw; px++) {
      const dx = (x0 + px) - cx;
      const dy = (y0 + py) - cy;
      if (dx * dx + dy * dy <= rSq) {
        const i = py * bw + px;
        if (!protectedDark[i]) {
          const idx = i * 4;
          data[idx] = rgb.r;
          data[idx + 1] = rgb.g;
          data[idx + 2] = rgb.b;
        }
      }
    }
  }
  wCtx.putImageData(imgData, x0, y0);
}

// أداة التمويه (Blur)
function blurBrushAt(wCanvas, cx, cy, radius) {
  const wCtx = wCanvas.getContext('2d');
  const x0 = Math.max(0, Math.floor(cx - radius));
  const y0 = Math.max(0, Math.floor(cy - radius));
  const x1 = Math.min(wCanvas.width - 1, Math.ceil(cx + radius));
  const y1 = Math.min(wCanvas.height - 1, Math.ceil(cy + radius));
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  if (bw <= 4 || bh <= 4) return;

  const imgData = wCtx.getImageData(x0, y0, bw, bh);
  const src = new Uint8ClampedArray(imgData.data);
  const dst = imgData.data;
  const rSq = radius * radius;
  const k = 2;

  for (let py = k; py < bh - k; py++) {
    for (let px = k; px < bw - k; px++) {
      const dx = (x0 + px) - cx;
      const dy = (y0 + py) - cy;
      if (dx * dx + dy * dy <= rSq) {
        let r = 0, g = 0, b = 0, count = 0;
        for (let ky = -k; ky <= k; ky++) {
          for (let kx = -k; kx <= k; kx++) {
            const idx = ((py + ky) * bw + (px + kx)) * 4;
            r += src[idx]; g += src[idx + 1]; b += src[idx + 2];
            count++;
          }
        }
        const outIdx = (py * bw + px) * 4;
        dst[outIdx] = r / count;
        dst[outIdx + 1] = g / count;
        dst[outIdx + 2] = b / count;
      }
    }
  }
  wCtx.putImageData(imgData, x0, y0);
}

function strokeBrush(fromPt, toPt) {
  const page = pages[currentIdx];
  const wCanvas = page.workCanvas;
  const wCtx = wCanvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  const scaleFactor = canvas.width / rect.width;
  const radius = (parseInt(document.getElementById('brushSize').value) / 2) * scaleFactor;
  const color = document.getElementById('brushColor').value;

  if (currentTool === 'brush') {
    wCtx.save();
    wCtx.beginPath();
    wCtx.moveTo(fromPt.x, fromPt.y);
    wCtx.lineTo(toPt.x, toPt.y);
    wCtx.strokeStyle = color;
    wCtx.lineWidth = radius * 2;
    wCtx.lineCap = 'round';
    wCtx.lineJoin = 'round';
    wCtx.stroke();
    wCtx.restore();
  } else if (currentTool === 'eraser') {
    wCtx.save();
    wCtx.beginPath();
    wCtx.moveTo(fromPt.x, fromPt.y);
    wCtx.lineTo(toPt.x, toPt.y);
    wCtx.lineWidth = radius * 2;
    wCtx.lineCap = 'round';
    wCtx.lineJoin = 'round';
    wCtx.clip();
    wCtx.drawImage(page.originalImg, 0, 0);
    wCtx.restore();
  } else if (currentTool === 'smart') {
    smartBrushAt(wCanvas, toPt.x, toPt.y, radius, color);
  } else if (currentTool === 'blur') {
    blurBrushAt(wCanvas, toPt.x, toPt.y, radius);
  }
  drawPage();
}

// ====================================================
// 7. تحديث القطارة المتحركة ومؤشر الدلو أثناء تحريك اليد
// ====================================================
function updateLivePicker(clientX, clientY) {
  const pt = getCanvasCoords(clientX, clientY);
  const page = pages[currentIdx];
  const px = Math.max(0, Math.min(page.workCanvas.width - 1, Math.floor(pt.x)));
  const py = Math.max(0, Math.min(page.workCanvas.height - 1, Math.floor(pt.y)));
  const pixel = page.workCanvas.getContext('2d').getImageData(px, py, 1, 1).data;
  pickedHexLive = rgbToHex(pixel[0], pixel[1], pixel[2]);

  pickerLoupe.style.display = 'flex';
  pickerLoupe.style.left = clientX + 'px';
  pickerLoupe.style.top = clientY + 'px';
  pickerLoupe.style.background = pickedHexLive;
  pickerHexText.innerText = pickedHexLive.toUpperCase();
}

function updateLiveBucketTarget(clientX, clientY) {
  activePt = getCanvasCoords(clientX, clientY);
  bucketTarget.style.display = 'flex';
  bucketTarget.style.left = clientX + 'px';
  bucketTarget.style.top = clientY + 'px';
}

// ====================================================
// 8. الزوم بالضغط المزدوج (Double-Tap) والتحكم بإصبعين
// ====================================================
function getCanvasCoords(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (canvas.width / r.width),
    y: (clientY - r.top) * (canvas.height / r.height)
  };
}

function updateStageTransform() {
  canvasStage.style.transform = `translate3d(${viewX}px, ${viewY}px, 0) scale(${viewScale})`;
  const zoomBtn = document.getElementById('resetZoomBtn');
  if (Math.abs(viewScale - 1) > 0.05 || Math.abs(viewX) > 5 || Math.abs(viewY) > 5) {
    zoomBtn.style.display = 'inline-block';
    zoomBtn.innerText = `🔍 ${Math.round(viewScale * 100)}% إعادة`;
  } else {
    zoomBtn.style.display = 'none';
  }
}

function resetZoom() {
  viewScale = 1;
  viewX = 0;
  viewY = 0;
  updateStageTransform();
}

function toggleDoubleTapZoom(clientX, clientY) {
  if (viewScale > 1.15) {
    resetZoom();
    setStatus("🔍 تم إرجاع حجم الصفحة إلى 100%");
  } else {
    const targetScale = 2.4;
    const boxRect = viewportBox.getBoundingClientRect();
    const tapX = clientX - boxRect.left;
    const tapY = clientY - boxRect.top;
    viewX = tapX - tapX * targetScale;
    viewY = tapY - tapY * targetScale;
    viewScale = targetScale;
    updateStageTransform();
    setStatus("🔍 تم تكبير الصفحة (اضغط مرتين مجدداً للتصغير)");
  }
}

viewportBox.addEventListener('touchstart', e => {
  if (!pages.length || isCompareMode) return;
  if (e.target.closest('#compareSlider')) return;

  // عند وضع إصبعين: تفعيل التحريك والزوم فوراً
  if (e.touches.length >= 2) {
    e.preventDefault();
    if (isDrawing && strokeSnapshot && (Date.now() - strokeStartTime < 200)) {
      pages[currentIdx].workCanvas.getContext('2d').putImageData(strokeSnapshot, 0, 0);
      pages[currentIdx].history.pop();
      drawPage();
    }
    isDrawing = false;
    isAimingBucket = false;
    isAimingPicker = false;
    isSingleFingerPan = false;
    pickerLoupe.style.display = 'none';
    bucketTarget.style.display = 'none';
    isTwoFingerGesture = true;

    const t1 = e.touches[0], t2 = e.touches[1];
    pinchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    pinchStartScale = viewScale;
    panStartMid = { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
    panStartOffset = { x: viewX, y: viewY };
    return;
  }

  if (e.touches.length === 1 && !isTwoFingerGesture) {
    e.preventDefault();
    const touch = e.touches[0];
    const now = Date.now();
    const tapDist = Math.hypot(touch.clientX - lastTapPos.x, touch.clientY - lastTapPos.y);

    // فحص الضغط المزدوج (Double-Tap) للزوم
    if (now - lastTapTime < 280 && tapDist < 32) {
      if (strokeSnapshot && pages[currentIdx].history.length > 0) {
        pages[currentIdx].workCanvas.getContext('2d').putImageData(strokeSnapshot, 0, 0);
        pages[currentIdx].history.pop();
        drawPage();
      }
      isDrawing = false;
      isAimingBucket = false;
      isAimingPicker = false;
      pickerLoupe.style.display = 'none';
      bucketTarget.style.display = 'none';
      lastTapTime = 0;
      toggleDoubleTapZoom(touch.clientX, touch.clientY);
      return;
    }
    lastTapTime = now;
    lastTapPos = { x: touch.clientX, y: touch.clientY };

    // إذا لم تكن هناك أداة محددة (بعد إلغاء التحديد)، نحرك الصفحة بإصبع واحد
    if (currentTool === null) {
      isSingleFingerPan = true;
      panStartMid = { x: touch.clientX, y: touch.clientY };
      panStartOffset = { x: viewX, y: viewY };
      return;
    }

    const pt = getCanvasCoords(touch.clientX, touch.clientY);
    const page = pages[currentIdx];
    if (pt.y > page.workCanvas.height) return;

    // القطارة المتحركة: تبدأ المعاينة وتتحرك مع الإصبع حتى يرفع يده
    if (currentTool === 'picker') {
      isAimingPicker = true;
      updateLivePicker(touch.clientX, touch.clientY);
      return;
    }

    // دلو تبييض الفقاعات: يظهر مؤشر التصويب ويتحرك مع الإصبع حتى يرفع يده
    if (currentTool === 'bucket') {
      isAimingBucket = true;
      updateLiveBucketTarget(touch.clientX, touch.clientY);
      return;
    }

    // أدوات الرسم المباشر (فرشاة، ذكية، ممحاة، تمويه)
    saveHistory(page);
    strokeSnapshot = page.history[page.history.length - 1];
    strokeStartTime = now;
    isDrawing = true;
    lastPt = pt;
    strokeBrush(pt, pt);
  }
}, { passive: false });

viewportBox.addEventListener('touchmove', e => {
  if (!pages.length || isCompareMode) return;

  if (isTwoFingerGesture && e.touches.length >= 2) {
    e.preventDefault();
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const mid = { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };

    const newScale = Math.max(0.85, Math.min(4.5, pinchStartScale * (dist / pinchStartDist)));
    const boxRect = viewportBox.getBoundingClientRect();
    const originX = panStartMid.x - boxRect.left;
    const originY = panStartMid.y - boxRect.top;

    viewX = mid.x - panStartMid.x + originX - (originX - panStartOffset.x) * (newScale / pinchStartScale);
    viewY = mid.y - panStartMid.y + originY - (originY - panStartOffset.y) * (newScale / pinchStartScale);
    viewScale = newScale;
    updateStageTransform();
    return;
  }

  if (e.touches.length === 1 && !isTwoFingerGesture) {
    e.preventDefault();
    const touch = e.touches[0];

    if (isSingleFingerPan) {
      viewX = panStartOffset.x + (touch.clientX - panStartMid.x);
      viewY = panStartOffset.y + (touch.clientY - panStartMid.y);
      updateStageTransform();
      return;
    }

    if (isAimingPicker) {
      updateLivePicker(touch.clientX, touch.clientY);
      return;
    }

    if (isAimingBucket) {
      updateLiveBucketTarget(touch.clientX, touch.clientY);
      return;
    }

    if (isDrawing) {
      const pt = getCanvasCoords(touch.clientX, touch.clientY);
      strokeBrush(lastPt, pt);
      lastPt = pt;
    }
  }
}, { passive: false });

viewportBox.addEventListener('touchend', e => {
  // عند رفع اليد في وضع القطارة -> اعتماد اللون فوراً
  if (isAimingPicker) {
    isAimingPicker = false;
    pickerLoupe.style.display = 'none';
    setPresetColor(pickedHexLive);
    setStatus(`💉 تم التقاط اللون (${pickedHexLive.toUpperCase()}) بنجاح!`);
  }

  // عند رفع اليد في وضع الدلو -> تبييض الفقاعة ومسح الكتابة بداخلها فوراً!
  if (isAimingBucket && activePt) {
    isAimingBucket = false;
    bucketTarget.style.display = 'none';
    const page = pages[currentIdx];
    saveHistory(page);
    cleanSpeechBubbleAt(page.workCanvas, activePt.x, activePt.y, document.getElementById('brushColor').value);
    drawPage();
    scheduleAutoSave();
    setStatus("🪣 تم تبييض الفقاعة ومسح الكتابة بداخلها!");
    activePt = null;
  }

  if (isDrawing) {
    isDrawing = false;
    lastPt = null;
    scheduleAutoSave();
  }

  if (e.touches.length === 0) {
    isTwoFingerGesture = false;
    isSingleFingerPan = false;
  }
});

// دعم الماوس أيضاً (للتجربة على الكمبيوتر)
viewportBox.addEventListener('dblclick', e => {
  if (!pages.length || isCompareMode) return;
  toggleDoubleTapZoom(e.clientX, e.clientY);
});

viewportBox.addEventListener('mousedown', e => {
  if (!pages.length || isCompareMode || e.button !== 0) return;
  if (e.target.closest('#compareSlider')) return;

  if (currentTool === null) {
    isSingleFingerPan = true;
    panStartMid = { x: e.clientX, y: e.clientY };
    panStartOffset = { x: viewX, y: viewY };
    return;
  }

  const pt = getCanvasCoords(e.clientX, e.clientY);
  const page = pages[currentIdx];
  if (pt.y > page.workCanvas.height) return;

  if (currentTool === 'picker') {
    isAimingPicker = true;
    updateLivePicker(e.clientX, e.clientY);
    return;
  }
  if (currentTool === 'bucket') {
    isAimingBucket = true;
    updateLiveBucketTarget(e.clientX, e.clientY);
    return;
  }

  saveHistory(page);
  isDrawing = true;
  lastPt = pt;
  strokeBrush(pt, pt);
});

window.addEventListener('mousemove', e => {
  if (!pages.length || isCompareMode) return;
  if (isSingleFingerPan) {
    viewX = panStartOffset.x + (e.clientX - panStartMid.x);
    viewY = panStartOffset.y + (e.clientY - panStartMid.y);
    updateStageTransform();
    return;
  }
  if (isAimingPicker) {
    updateLivePicker(e.clientX, e.clientY);
    return;
  }
  if (isAimingBucket) {
    updateLiveBucketTarget(e.clientX, e.clientY);
    return;
  }
  if (isDrawing) {
    const pt = getCanvasCoords(e.clientX, e.clientY);
    strokeBrush(lastPt, pt);
    lastPt = pt;
  }
});

window.addEventListener('mouseup', () => {
  if (isAimingPicker) {
    isAimingPicker = false;
    pickerLoupe.style.display = 'none';
    setPresetColor(pickedHexLive);
    setStatus(`💉 تم التقاط اللون (${pickedHexLive.toUpperCase()}) بنجاح!`);
  }
  if (isAimingBucket && activePt) {
    isAimingBucket = false;
    bucketTarget.style.display = 'none';
    const page = pages[currentIdx];
    saveHistory(page);
    cleanSpeechBubbleAt(page.workCanvas, activePt.x, activePt.y, document.getElementById('brushColor').value);
    drawPage();
    scheduleAutoSave();
    setStatus("🪣 تم تبييض الفقاعة ومسح الكتابة بداخلها!");
    activePt = null;
  }
  if (isDrawing) {
    isDrawing = false;
    lastPt = null;
    scheduleAutoSave();
  }
  isSingleFingerPan = false;
});

// ====================================================
// 9. التراجع، الإعادة، والتنقل بين الصفحات
// ====================================================
function undoLastAction() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  if (page.history.length > 0) {
    const prev = page.history.pop();
    page.workCanvas.getContext('2d').putImageData(prev, 0, 0);
    drawPage();
    scheduleAutoSave();
    setStatus("↩️ تم التراجع عن الخطوة الأخيرة");
  }
}

function resetCurrentPage() {
  if (!pages.length) return;
  if (!confirm("هل تريد استرجاع هذه الصفحة لحالتها الأصلية؟")) return;
  const page = pages[currentIdx];
  saveHistory(page);
  page.workCanvas.getContext('2d').drawImage(page.originalImg, 0, 0);
  drawPage();
  scheduleAutoSave();
  setStatus("🔄 تمت إعادة الصفحة لحالتها الأصلية");
}

function changePage(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < pages.length) {
    currentIdx = next;
    resetZoom();
    drawPage();
    saveCurrentPageToDB();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function togglePagesModal() {
  if (!pages.length) return;
  const modal = document.getElementById('pagesModal');
  const grid = document.getElementById('pagesGrid');
  if (!modal.classList.contains('open')) {
    grid.innerHTML = '';
    pages.forEach((p, idx) => {
      const div = document.createElement('div');
      div.className = 'page-card' + (idx === currentIdx ? ' current' : '');
      div.innerText = `صفحة ${idx + 1}`;
      div.onclick = () => {
        currentIdx = idx;
        resetZoom();
        drawPage();
        saveCurrentPageToDB();
        modal.classList.remove('open');
      };
      grid.appendChild(div);
    });
    modal.classList.add('open');
  } else {
    modal.classList.remove('open');
  }
}

// ====================================================
// 10. تصدير الفصل بصيغة WebP ZIP أو إرساله للنشر
// ====================================================
async function generateFinalZipBlob() {
  const zip = new JSZip();
  const savedIdx = currentIdx;
  const wasCompare = isCompareMode;
  if (wasCompare) toggleCompareMode();

  for (let i = 0; i < pages.length; i++) {
    currentIdx = i;
    drawPage();
    const webpBlob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.85));
    zip.file(`page_${String(i + 1).padStart(3, '0')}.webp`, webpBlob);
  }
  currentIdx = savedIdx;
  drawPage();
  return await zip.generateAsync({ type: 'blob' });
}

async function downloadZip() {
  if (!pages.length) return;
  setStatus("⏳ جاري ضغط الصفحات بصيغة WebP...");
  const blob = await generateFinalZipBlob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "futaarab_cleaned_chapter.zip";
  a.click();
  setStatus("✅ تم تحميل ملف الـ ZIP بنجاح!");
}

async function sendToUploaderPage() {
  if (!pages.length) return;
  setStatus("⏳ جاري تجهيز الفصل ونقله إلى صفحة الرفع...");
  const zipBlob = await generateFinalZipBlob();

  const req = indexedDB.open("FutaArabBridgeDB", 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore("files");
  req.onsuccess = e => {
    const db = e.target.result;
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").put(zipBlob, "readyChapterZip");
    tx.oncomplete = () => {
      window.location.href = "uploader.html?autoLoad=true";
    };
  };
}
