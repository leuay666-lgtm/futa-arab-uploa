<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مبيض الفصول التلقائي - FutaArab</title>
  <!-- مكتبة فك وضغط ملفات ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- مكتبة لاكتشاف مكان النص الإنجليزي مجاناً وبدون أي مفتاح API -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* يمكنك تعديل هذه الألوان لتطابق ملف CSS الخاص بموقعك تماماً */
    :root {
      --bg-main: #0a0a0c;
      --bg-card: #141418;
      --primary: #ff2a5f;
      --text-light: #ffffff;
      --text-gray: #9ca3af;
      --border-color: #26262e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: var(--bg-main); color: var(--text-light); padding: 12px; }

    .container { max-width: 600px; margin: 0 auto; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .title { font-size: 16px; font-weight: 900; color: var(--primary); margin-bottom: 10px; display: flex; justify-content: space-between; }

    .btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 14px;
      font-weight: 700; color: #fff; background: var(--primary); cursor: pointer; margin-top: 8px;
    }
    .btn:disabled { opacity: 0.5; }
    .btn-dark { background: #26262e; }
    .btn-send { background: #10b981; font-size: 15px; }

    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; }
    input[type="file"] { width: 100%; padding: 10px; background: #1c1c22; border: 1px dashed var(--primary); border-radius: 8px; color: var(--text-gray); }

    .status { font-size: 13px; color: #fbbf24; text-align: center; margin: 8px 0; font-weight: 700; }
    
    .canvas-box { background: #000; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-top: 8px; text-align: center; }
    canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; touch-action: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">
      <span>1. رفع وتبييض الفصل بنقرة زر</span>
      <span style="color:var(--text-gray); font-size:12px;">futaarab.com</span>
    </div>
    
    <input type="file" id="fileInput" accept=".zip,image/*" multiple>
    <div class="status" id="statusMsg">اختر ملف ZIP أو صور الفصل للبدء...</div>

    <!-- زر التبييض التلقائي بنقرة واحدة -->
    <button class="btn" id="autoCleanBtn" onclick="autoCleanAllPages()" disabled>✨ تبييض كل الصفحات تلقائياً (بنقرة زر)</button>
  </div>

  <!-- معاينة الصفحات والتعديل اليدوي باللمس عند الحاجة -->
  <div class="card">
    <div class="row" style="margin-top:0; margin-bottom:8px;">
      <button class="btn btn-dark" style="width:auto; margin:0; padding:8px 16px;" onclick="changePage(-1)">◀ السابق</button>
      <span id="pageCount" style="font-weight:bold;">0 / 0</span>
      <button class="btn btn-dark" style="width:auto; margin:0; padding:8px 16px;" onclick="changePage(1)">التالي ▶</button>
    </div>

    <p style="font-size:11px; color:var(--text-gray); text-align:center;">💡 يمكنك أيضاً لمس وسحب أي منطقة على الصورة لتبييضها يدوياً</p>
    
    <div class="canvas-box">
      <canvas id="pageCanvas"></canvas>
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="undoManualBox()">↩️ تراجع عن آخر مسحة</button>
    </div>
  </div>

  <!-- زر الإرسال المباشر إلى صفحة uploader.html -->
  <div class="card">
    <button class="btn btn-send" id="sendToUploaderBtn" onclick="sendToUploaderPage()" disabled>
      🚀 حفظ وإرسال الفصل جاهزاً إلى صفحة الرفع (Uploader)
    </button>
  </div>
</div>

<script>
const canvas = document.getElementById('pageCanvas');
const ctx = canvas.getContext('2d');
let pages = []; // [{ name, img, boxes: [{x, y, w, h}] }]
let currentIdx = 0;
let isDrawing = false, startX = 0, startY = 0;

function setStatus(text) {
  document.getElementById('statusMsg').innerText = text;
}

// 1. قراءة ملف الـ ZIP أو الصور
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  pages = [];
  currentIdx = 0;
  setStatus("⏳ جاري فك الضغط وتجهيز الصفحات...");

  if (files[0].name.endsWith('.zip')) {
    const zip = await JSZip.loadAsync(files[0]);
    const entries = [];
    zip.forEach((path, entry) => {
      if (!entry.dir && /\.(jpe?g|png|webp)$/i.test(entry.name)) entries.push(entry);
    });
    entries.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    for (const entry of entries) {
      const blob = await entry.async('blob');
      pages.push({ name: entry.name, img: await loadImg(blob), boxes: [] });
    }
  } else {
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    for (const file of files) {
      pages.push({ name: file.name, img: await loadImg(file), boxes: [] });
    }
  }

  document.getElementById('autoCleanBtn').disabled = false;
  document.getElementById('sendToUploaderBtn').disabled = false;
  setStatus(`✅ تم تجهيز ${pages.length} صفحة! اضغط على زر التبييض التلقائي.`);
  drawPage();
});

function loadImg(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = URL.createObjectURL(blob);
  });
}

// 2. رسم الصفحة + التبييض + العلامة المائية والشريط السفلي
function drawPage() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  const img = page.img;
  const footerH = Math.max(36, Math.floor(img.height * 0.03));

  canvas.width = img.width;
  canvas.height = img.height + footerH;

  // رسم الصورة الأصلية
  ctx.drawImage(img, 0, 0);

  // رسم مربعات التبييض فوق الكلام الإنجليزي
  ctx.fillStyle = "#ffffff";
  page.boxes.forEach(b => {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });

  // علامة مائية شفافة
  ctx.save();
  ctx.font = `900 ${Math.max(18, Math.floor(img.width * 0.03))}px 'Tajawal', sans-serif`;
  ctx.fillStyle = "rgba(255, 42, 95, 0.30)";
  ctx.textAlign = "left";
  ctx.fillText("futaarab.com", 20, img.height - 20);
  ctx.restore();

  // شريط سفلي ثابت باسم الموقع
  ctx.fillStyle = "#0a0a0c";
  ctx.fillRect(0, img.height, canvas.width, footerH);
  ctx.fillStyle = "#ffffff";
  ctx.font = `700 ${Math.max(14, Math.floor(footerH * 0.48))}px 'Tajawal', sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("تمت ترجمة هذا العمل بواسطة موقع futaarab.com", canvas.width / 2, img.height + footerH / 2);

  document.getElementById('pageCount').innerText = `${currentIdx + 1} / ${pages.length}`;
}

// 3. التبييض التلقائي لكل الصفحات بنقرة زر واحدة!
async function autoCleanAllPages() {
  if (!pages.length) return;
  document.getElementById('autoCleanBtn').disabled = true;

  for (let i = 0; i < pages.length; i++) {
    setStatus(`⏳ جاري تبييض الصفحة ${i + 1} من ${pages.length} تلقائياً...`);
    const page = pages[i];

    // اكتشاف أماكن الكلمات الإنجليزية في الصفحة
    const result = await Tesseract.recognize(page.img, 'eng');
    const words = result.data.words || [];

    words.forEach(w => {
      // نتأكد أن خلفية الكلمة بيضاء (داخل فقاعة كلام) حتى لا نمسح جزءاً من الرسمة
      if (w.confidence > 45 && isBubbleBackgroundWhite(page.img, w.bbox)) {
        const pad = 4; // توسيع بسيط لضمان مسح الحروف بالكامل
        page.boxes.push({
          x: w.bbox.x0 - pad,
          y: w.bbox.y0 - pad,
          w: (w.bbox.x1 - w.bbox.x0) + pad * 2,
          h: (w.bbox.y1 - w.bbox.y0) + pad * 2
        });
      }
    });
  }

  drawPage();
  document.getElementById('autoCleanBtn').disabled = false;
  setStatus("🎉 تم تبييض جميع الصفحات تلقائياً! راجعها أو أرسلها لصفحة الرفع.");
}

// دالة ذكية تتأكد أن الكلام موجود داخل فقاعة بيضاء وليس فوق الرسمة
function isBubbleBackgroundWhite(imgElement, bbox) {
  const tempC = document.createElement('canvas');
  const w = bbox.x1 - bbox.x0;
  const h = bbox.y1 - bbox.y0;
  if (w <= 0 || h <= 0) return false;
  tempC.width = w; tempC.height = h;
  const tCtx = tempC.getContext('2d');
  tCtx.drawImage(imgElement, bbox.x0, bbox.y0, w, h, 0, 0, w, h);
  const data = tCtx.getImageData(0, 0, w, h).data;
  let whitePixels = 0, total = data.length / 4;

  for (let i = 0; i < data.length; i += 4) {
    if (data[i] > 200 && data[i+1] > 200 && data[i+2] > 200) whitePixels++;
  }
  return (whitePixels / total) > 0.45; // إذا كان أكثر من 45% من المربع أبيض فهو فقاعة نص
}

// 4. التبييض اليدوي الإضافي باللمس (إذا أردت مسح شيء بنفسك)
function getCoords(e) {
  const r = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) };
}

canvas.addEventListener('pointerdown', e => {
  if (!pages.length) return;
  const p = getCoords(e); startX = p.x; startY = p.y; isDrawing = true;
});

canvas.addEventListener('pointerup', e => {
  if (!isDrawing) return;
  isDrawing = false;
  const p = getCoords(e);
  const bx = Math.min(startX, p.x), by = Math.min(startY, p.y);
  const bw = Math.abs(p.x - startX), bh = Math.abs(p.y - startY);
  if (bw > 10 && bh > 10) {
    pages[currentIdx].boxes.push({ x: bx, y: by, w: bw, h: bh });
    drawPage();
  }
});

function undoManualBox() {
  if (!pages.length) return;
  pages[currentIdx].boxes.pop();
  drawPage();
}

function changePage(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < pages.length) { currentIdx = next; drawPage(); }
}

// 5. تحويل الصفحات إلى ملف ZIP بصيغة WebP وإرساله تلقائياً إلى uploader.html
async function sendToUploaderPage() {
  if (!pages.length) return;
  setStatus("⏳ جاري ضغط الصفحات بصيغة WebP وتجهيزها للنقل...");
  const zip = new JSZip();
  const savedIdx = currentIdx;

  for (let i = 0; i < pages.length; i++) {
    currentIdx = i;
    drawPage();
    const webpBlob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.85));
    zip.file(`page_${String(i + 1).padStart(3, '0')}.webp`, webpBlob);
  }
  currentIdx = savedIdx;
  drawPage();

  const zipBlob = await zip.generateAsync({ type: 'blob' });

  // حفظ ملف الـ ZIP في ذاكرة المتصفح (IndexedDB) ليقرأه ملف uploader.html فوراً
  const req = indexedDB.open("FutaArabBridgeDB", 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore("files");
  req.onsuccess = e => {
    const db = e.target.result;
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").put(zipBlob, "readyChapterZip");
    tx.oncomplete = () => {
      // توجيه المستخدم تلقائياً إلى صفحة الرفع الخاصة بموقعك!
      window.location.href = "uploader.html?autoLoad=true";
    };
  };
}
</script>
</body>
</html>
