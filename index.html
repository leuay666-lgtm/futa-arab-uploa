<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>استوديو الترجمة الذكي - FutaArab</title>
  <!-- مكتبة فك ضغط ملفات ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- مكتبة Supabase للرفع السحابي -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- خط عربي مناسب للمانغا -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0d0d12;
      --card-bg: #16161f;
      --accent: #e91e63;
      --accent-hover: #ad1457;
      --text: #f1f1f1;
      --muted: #8b8b9e;
      --border: #2a2a3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg-dark); color: var(--text); padding: 12px; padding-bottom: 60px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
    .header h2 { font-size: 18px; color: var(--accent); }
    
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    input, select, textarea, button {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #1f1f2e; color: var(--text); font-size: 13px; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    
    button { background: var(--accent); color: #fff; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); background: var(--accent-hover); }
    button.secondary { background: #2a2a3a; }
    button.success { background: #10b981; }
    button.danger { background: #ef4444; }

    .toolbar { display: flex; gap: 6px; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; }
    .page-indicator { font-weight: bold; font-size: 14px; color: var(--accent); }

    .canvas-container {
      position: relative; width: 100%; overflow: auto; background: #000;
      border: 2px solid var(--border); border-radius: 10px; text-align: center;
    }
    canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    canvas.draw-mode { touch-action: none; cursor: crosshair; }

    .bubble-editor { border-top: 2px solid var(--accent); margin-top: 10px; padding-top: 10px; }
    .status-bar { font-size: 12px; color: #fbbf24; margin-top: 6px; text-align: center; min-height: 18px; }
  </style>
</head>
<body>

  <div class="header">
    <h2>استوديو ترجمة وتبييض المانغا</h2>
    <span style="font-size:12px; color:var(--muted);">futaarab.com</span>
  </div>

  <!-- إعدادات الـ API والرفع -->
  <div class="panel">
    <div class="grid-2" style="margin-bottom: 8px;">
      <input type="password" id="openRouterKey" placeholder="مفتاح OpenRouter API">
      <select id="aiModel">
        <option value="qwen/qwen-2.5-vl-72b-instruct">Qwen 2.5 VL 72B (قراءة وترجمة مباشرة)</option>
        <option value="google/gemini-2.5-flash">Gemini 2.5 Flash (سريع جداً)</option>
        <option value="meta-llama/llama-3.2-90b-vision-instruct">Llama 3.2 90B Vision</option>
      </select>
    </div>
    <div class="grid-2" style="margin-bottom: 8px;">
      <input type="text" id="mangaTitle" placeholder="اسم المانغا / العمل">
      <input type="text" id="chapterNum" placeholder="رقم الفصل (مثال: 12)">
    </div>
    <div>
      <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:4px;">ارفع ملف ZIP للفصل أو اختر عدة صور:</label>
      <input type="file" id="fileInput" accept=".zip,image/*" multiple>
    </div>
    <div class="status-bar" id="statusText">جاهز لاستقبال الملفات...</div>
  </div>

  <!-- أدوات التحكم بالصفحة والرسم -->
  <div class="panel">
    <div class="toolbar">
      <button class="secondary" style="width:auto;" onclick="prevPage()">◀ السابق</button>
      <span class="page-indicator" id="pageCounter">0 / 0</span>
      <button class="secondary" style="width:auto;" onclick="nextPage()">التالي ▶</button>
    </div>

    <div class="grid-2" style="margin-bottom: 8px;">
      <button id="modeBtn" onclick="toggleMode()">✍️ الوضع الحالي: تحديد وتبييض</button>
      <button class="secondary" onclick="undoLastBubble()">↩️ تراجع عن آخر فقاعة</button>
    </div>

    <!-- لوحة عرض الصفحة -->
    <div class="canvas-container">
      <canvas id="editorCanvas" class="draw-mode"></canvas>
    </div>

    <!-- محرر الفقاعة المحددة (للتعديل اليدوي والتدقيق) -->
    <div class="bubble-editor" id="bubbleEditor" style="display:none;">
      <label style="font-size:12px; color:var(--accent);">تعديل وتدقيق النص المترجم للفقاعة الأخيرة:</label>
      <textarea id="bubbleTextInput" rows="2" style="margin: 6px 0;" oninput="updateActiveBubble()"></textarea>
      <div class="grid-2">
        <div>
          <label style="font-size:11px; color:var(--muted);">حجم الخط:</label>
          <input type="number" id="bubbleFontSize" value="22" min="10" max="60" oninput="updateActiveBubble()">
        </div>
        <div>
          <label style="font-size:11px; color:var(--muted);">لون التبييض:</label>
          <input type="color" id="bubbleBgColor" value="#ffffff" style="height:38px; padding:2px;" oninput="updateActiveBubble()">
        </div>
      </div>
    </div>
  </div>

  <!-- أزرار التصدير والرفع إلى الطلبات -->
  <div class="panel grid-2">
    <button class="secondary" onclick="downloadAllAsZip()">📦 تحميل الفصل (ZIP WebP)</button>
    <button class="success" onclick="uploadToSupabaseRequests()">☁️ رفع الفصل إلى طلبات الموقع</button>
  </div>

<script>
// ================= إعدادات SUPABASE الخاصة بموقعك =================
const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const STORAGE_BUCKET = "chapters"; // اسم الباكيت في سوبابيس
const REQUESTS_TABLE = "chapter_requests"; // اسم جدول الطلبات في قاعدة البيانات

const supabaseClient = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// ================= متغيرات النظام =================
const canvas = document.getElementById('editorCanvas');
const ctx = canvas.getContext('2d');
let pages = []; // [{ name, imgElement, bubbles: [{x, y, w, h, text, fontSize, bg}] }]
let currentIndex = 0;
let isDrawMode = true;
let isDrawing = false;
let startX = 0, startY = 0;

function setStatus(msg) {
  document.getElementById('statusText').innerText = msg;
}

// 1. رفع وفك ضغط ملف ZIP أو الصور المتعددة
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  pages = [];
  currentIndex = 0;
  setStatus("جاري قراءة وتجهيز الصفحات...");

  if (files[0].name.endsWith('.zip')) {
    const zip = await JSZip.loadAsync(files[0]);
    const entries = [];
    zip.forEach((relativePath, zipEntry) => {
      if (!zipEntry.dir && /\.(jpe?g|png|webp)$/i.test(zipEntry.name)) {
        entries.push(zipEntry);
      }
    });
    entries.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

    for (const entry of entries) {
      const blob = await entry.async('blob');
      const img = await blobToImage(blob);
      pages.push({ name: entry.name, imgElement: img, bubbles: [] });
    }
  } else {
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    for (const file of files) {
      const img = await blobToImage(file);
      pages.push({ name: file.name, imgElement: img, bubbles: [] });
    }
  }

  setStatus(`تم تحميل ${pages.length} صفحة بنجاح!`);
  renderCurrentPage();
});

function blobToImage(blob) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => resolve(img);
    img.src = url;
  });
}

// 2. عرض الصفحة + رسم الفقاعات + العلامة المائية والشريط السفلي
function renderCurrentPage() {
  if (!pages.length) return;
  const page = pages[currentIndex];
  const img = page.imgElement;

  const footerHeight = Math.max(36, Math.floor(img.height * 0.03));
  canvas.width = img.width;
  canvas.height = img.height + footerHeight;

  // رسم الصفحة الأصلية
  ctx.drawImage(img, 0, 0);

  // رسم جميع الفقاعات المبيّضة والنصوص المترجمة
  page.bubbles.forEach(b => {
    // تبييض مكان النص الإنجليزي
    ctx.fillStyle = b.bg || "#ffffff";
    ctx.fillRect(b.x, b.y, b.w, b.h);

    // كتابة النص العربي
    drawWrappedArabicText(b.text, b.x, b.y, b.w, b.h, b.fontSize);
  });

  // إضافة علامة مائية شفافة على الصفحة
  ctx.save();
  ctx.font = `900 ${Math.max(18, Math.floor(img.width * 0.03))}px 'Cairo', sans-serif`;
  ctx.fillStyle = "rgba(233, 30, 99, 0.28)";
  ctx.textAlign = "left";
  ctx.fillText("futaarab.com", 20, img.height - 20);
  ctx.restore();

  // إضافة الشريط السفلي الثابت لحقوق الموقع
  ctx.fillStyle = "#0d0d12";
  ctx.fillRect(0, img.height, canvas.width, footerHeight);
  ctx.fillStyle = "#ffffff";
  ctx.font = `700 ${Math.max(14, Math.floor(footerHeight * 0.5))}px 'Cairo', sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("تمت ترجمة هذا العمل بواسطة موقع futaarab.com", canvas.width / 2, img.height + footerHeight / 2);

  document.getElementById('pageCounter').innerText = `${currentIndex + 1} / ${pages.length}`;
  updateEditorUI();
}

// 3. تقسيم الأسطر وكتابة النص العربي داخل الفقاعة
function drawWrappedArabicText(text, x, y, w, h, fontSize) {
  ctx.fillStyle = "#000000";
  ctx.font = `700 ${fontSize}px 'Cairo', Tahoma, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const maxWidth = Math.abs(w) - 12;
  const words = text.split(/\s+/);
  let lines = [];
  let currentLine = words[0] || "";

  for (let i = 1; i < words.length; i++) {
    const testLine = currentLine + " " + words[i];
    if (ctx.measureText(testLine).width <= maxWidth) {
      currentLine = testLine;
    } else {
      lines.push(currentLine);
      currentLine = words[i];
    }
  }
  lines.push(currentLine);

  const lineHeight = fontSize * 1.35;
  const startY = (y + h / 2) - ((lines.length - 1) * lineHeight) / 2;

  lines.forEach((line, idx) => {
    ctx.fillText(line, x + w / 2, startY + idx * lineHeight);
  });
}

// 4. تحديد الفقاعة باللمس على شاشة الآيفون
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width),
    y: (clientY - rect.top) * (canvas.height / rect.height)
  };
}

canvas.addEventListener('pointerdown', (e) => {
  if (!isDrawMode || !pages.length) return;
  const pos = getCanvasCoords(e);
  startX = pos.x;
  startY = pos.y;
  isDrawing = true;
});

canvas.addEventListener('pointerup', async (e) => {
  if (!isDrawing || !isDrawMode) return;
  isDrawing = false;
  const pos = getCanvasCoords(e);

  const bx = Math.min(startX, pos.x);
  const by = Math.min(startY, pos.y);
  const bw = Math.abs(pos.x - startX);
  const bh = Math.abs(pos.y - startY);

  if (bw < 25 || bh < 25) return; // تجاهل اللمسات الخاطئة الصغيرة

  // قص صورة الفقاعة الأصلية فقط لإرسالها إلى OpenRouter
  const page = pages[currentIndex];
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = bw;
  cropCanvas.height = bh;
  cropCanvas.getContext('2d').drawImage(page.imgElement, bx, by, bw, bh, 0, 0, bw, bh);
  const base64Crop = cropCanvas.toDataURL('image/jpeg', 0.9);

  const defaultFontSize = Math.max(16, Math.min(30, Math.floor(bw / 7)));
  const newBubble = { x: bx, y: by, w: bw, h: bh, text: "...", fontSize: defaultFontSize, bg: "#ffffff" };
  page.bubbles.push(newBubble);
  renderCurrentPage();

  setStatus("جاري قراءة الفقاعة وترجمتها وتدقيقها عبر OpenRouter...");
  const translated = await translateWithOpenRouter(base64Crop);
  newBubble.text = translated;
  renderCurrentPage();
  setStatus("تمت الترجمة! يمكنك تعديل النص من الأسفل إن أردت.");
});

// 5. الاتصال بـ OpenRouter API لقراءة الفقاعة وترجمتها
async function translateWithOpenRouter(base64Image) {
  const apiKey = document.getElementById('openRouterKey').value.trim();
  const model = document.getElementById('aiModel').value;
  if (!apiKey) return "ضع مفتاح OpenRouter!";

  try {
    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: model,
        messages: [
          {
            role: "system",
            content: "أنت مترجم ومدقق لغوي محترف للمانغا والمانهوا الموجهة للبالغين (+18). قم بقراءة النص الإنجليزي الموجود في صورة الفقاعة، وترجمته إلى اللغة العربية بدقة تامة وبنفس النبرة الجريئة والعامية أو الألفاظ الصريحة الموجودة في النص الأصلي دون أي حذف أو تلطيف، مع تدقيق الجملة لتبدو طبيعية وسلسة للقارئ العربي. أخرج النص العربي المترجم فقط بدون أي علامات تنصيص أو مقدمات."
          },
          {
            role: "user",
            content: [
              { type: "text", text: "اقرأ النص في هذه الفقاعة وترجمه إلى العربية مباشرة:" },
              { type: "image_url", image_url: { url: base64Image } }
            ]
          }
        ]
      })
    });

    const data = await response.json();
    return data.choices?.[0]?.message?.content?.trim() || "تعذر قراءة النص";
  } catch (err) {
    console.error(err);
    return "خطأ في الاتصال";
  }
}

// 6. أدوات التعديل اليدوي والتنقل
function updateEditorUI() {
  const page = pages[currentIndex];
  const editor = document.getElementById('bubbleEditor');
  if (!page || !page.bubbles.length) {
    editor.style.display = 'none';
    return;
  }
  editor.style.display = 'block';
  const lastBubble = page.bubbles[page.bubbles.length - 1];
  document.getElementById('bubbleTextInput').value = lastBubble.text;
  document.getElementById('bubbleFontSize').value = lastBubble.fontSize;
  document.getElementById('bubbleBgColor').value = lastBubble.bg;
}

function updateActiveBubble() {
  const page = pages[currentIndex];
  if (!page || !page.bubbles.length) return;
  const lastBubble = page.bubbles[page.bubbles.length - 1];
  lastBubble.text = document.getElementById('bubbleTextInput').value;
  lastBubble.fontSize = parseInt(document.getElementById('bubbleFontSize').value) || 20;
  lastBubble.bg = document.getElementById('bubbleBgColor').value;
  renderCurrentPage();
}

function undoLastBubble() {
  if (!pages.length) return;
  pages[currentIndex].bubbles.pop();
  renderCurrentPage();
}

function toggleMode() {
  isDrawMode = !isDrawMode;
  const btn = document.getElementById('modeBtn');
  if (isDrawMode) {
    canvas.classList.add('draw-mode');
    btn.innerText = "✍️ الوضع الحالي: تحديد وتبييض";
    btn.style.background = "var(--accent)";
  } else {
    canvas.classList.remove('draw-mode');
    btn.innerText = "🖐️ الوضع الحالي: تمرير الشاشة";
    btn.style.background = "#2a2a3a";
  }
}

function prevPage() {
  if (currentIndex > 0) { currentIndex--; renderCurrentPage(); }
}
function nextPage() {
  if (currentIndex < pages.length - 1) { currentIndex++; renderCurrentPage(); }
}

// تحويل أية صفحة إلى WebP مع العلامة المائية والفقاعات
async function renderPageToWebpBlob(pageIndex) {
  const prevIdx = currentIndex;
  currentIndex = pageIndex;
  renderCurrentPage();
  const blob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.85));
  currentIndex = prevIdx;
  renderCurrentPage();
  return blob;
}

// 7. تحميل الفصل كامل كملف ZIP بصيغة WebP
async function downloadAllAsZip() {
  if (!pages.length) return alert("لا توجد صفحات!");
  setStatus("جاري تحويل الصفحات إلى WebP وضغطها...");
  const zip = new JSZip();

  for (let i = 0; i < pages.length; i++) {
    const blob = await renderPageToWebpBlob(i);
    const pageNum = String(i + 1).padStart(3, '0');
    zip.file(`futaarab_${pageNum}.webp`, blob);
  }

  const content = await zip.generateAsync({ type: "blob" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(content);
  a.download = `chapter_${document.getElementById('chapterNum').value || 'translated'}.zip`;
  a.click();
  setStatus("تم تحميل ملف الـ ZIP بنجاح!");
}

// 8. الرفع التلقائي إلى تخزين Supabase وإضافته في جدول الطلبات (Requests)
async function uploadToSupabaseRequests() {
  if (!pages.length) return alert("ارفع الصفحات أولاً!");
  const mangaTitle = document.getElementById('mangaTitle').value.trim();
  const chapterNum = document.getElementById('chapterNum').value.trim();
  if (!mangaTitle || !chapterNum) return alert("يرجى كتابة اسم المانغا ورقم الفصل أولاً!");

  setStatus("جاري ضغط الصفحات ورفعها إلى التخزين السحابي...");
  const uploadedUrls = [];
  const folderPath = `requests/${Date.now()}_ch${chapterNum}`;

  try {
    for (let i = 0; i < pages.length; i++) {
      setStatus(`جاري رفع الصفحة ${i + 1} من ${pages.length}...`);
      const webpBlob = await renderPageToWebpBlob(i);
      const fileName = `${folderPath}/page_${String(i + 1).padStart(3, '0')}.webp`;

      const { error: uploadErr } = await supabaseClient.storage
        .from(STORAGE_BUCKET)
        .upload(fileName, webpBlob, { contentType: 'image/webp' });

      if (uploadErr) throw uploadErr;

      const { data: publicUrlData } = supabaseClient.storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(fileName);

      uploadedUrls.push(publicUrlData.publicUrl);
    }

    // إدراج الفصل في جدول طلبات النشر للموافقة عليه من لوحة الإدارة
    const { error: dbErr } = await supabaseClient
      .from(REQUESTS_TABLE)
      .insert([{
        manga_title: mangaTitle,
        chapter_number: chapterNum,
        pages_urls: uploadedUrls,
        status: 'pending', // قيد المراجعة في الطلبات
        source: 'AI_Translator_Studio'
      }]);

    if (dbErr) throw dbErr;
    setStatus("✅ تم رفع الفصل بنجاح إلى قسم الطلبات في موقعك!");
    alert("تم إرسال الفصل المترجم إلى قائمة الطلبات (Pending) للمراجعة والنشر!");
  } catch (err) {
    console.error(err);
    setStatus("❌ حدث خطأ أثناء الرفع: تأكد من إعدادات Supabase");
  }
}
</script>
</body>
</html>
