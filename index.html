<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مبيض الفصول الذكي - FutaArab</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0a0a0c;
      --bg-card: #141418;
      --primary: #ff2a5f;
      --text-light: #ffffff;
      --text-gray: #9ca3af;
      --border-color: #26262e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: var(--bg-main); color: var(--text-light); padding: 12px; }

    .container { max-width: 600px; margin: 0 auto; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .title { font-size: 16px; font-weight: 900; color: var(--primary); margin-bottom: 10px; display: flex; justify-content: space-between; }

    .btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 14px;
      font-weight: 700; color: #fff; background: var(--primary); cursor: pointer; margin-top: 8px;
    }
    .btn:disabled { opacity: 0.5; }
    .btn-dark { background: #26262e; }
    .btn-active { background: #10b981; }
    .btn-send { background: #10b981; font-size: 15px; }

    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; }
    input[type="file"] { width: 100%; padding: 10px; background: #1c1c22; border: 1px dashed var(--primary); border-radius: 8px; color: var(--text-gray); }

    .status { font-size: 13px; color: #fbbf24; text-align: center; margin: 8px 0; font-weight: 700; }
    
    .canvas-box { background: #000; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-top: 8px; text-align: center; }
    canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    canvas.no-scroll { touch-action: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">
      <span>1. ماسح الحروف الذكي (بدون مربعات)</span>
      <span style="color:var(--text-gray); font-size:12px;">futaarab.com</span>
    </div>
    
    <input type="file" id="fileInput" accept=".zip,image/*" multiple>
    <div class="status" id="statusMsg">اختر ملف ZIP أو صور الفصل للبدء...</div>

    <button class="btn" id="autoCleanBtn" onclick="autoCleanTextOnly()" disabled>
      ✨ مسح الحروف تلقائياً (يمسح الحرف فقط ولا يرسم مربعات)
    </button>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0; margin-bottom:8px;">
      <button class="btn btn-dark" style="width:auto; margin:0; padding:8px 16px;" onclick="changePage(-1)">◀ السابق</button>
      <span id="pageCount" style="font-weight:bold;">0 / 0</span>
      <button class="btn btn-dark" style="width:auto; margin:0; padding:8px 16px;" onclick="changePage(1)">التالي ▶</button>
    </div>

    <!-- أزرار التحكم باللمس -->
    <div class="row" style="margin-bottom: 8px;">
      <button class="btn btn-active" id="brushBtn" style="margin:0; font-size:12px;" onclick="setMode('brush')">
        🖌️ فرشاة مسح الكلام (مرر إصبعك فوق الكلام)
      </button>
      <button class="btn btn-dark" id="scrollBtn" style="margin:0; font-size:12px;" onclick="setMode('scroll')">
        🖐️ تمرير الشاشة
      </button>
    </div>

    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12px; color:var(--text-gray);">
      <span>حجم الفرشاة:</span>
      <input type="range" id="brushSize" min="15" max="80" value="40" style="flex:1;">
    </div>
    
    <div class="canvas-box">
      <canvas id="pageCanvas" class="no-scroll"></canvas>
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="undoLastAction()">↩️ تراجع عن آخر خطوة</button>
      <button class="btn btn-dark" onclick="resetCurrentPage()">🔄 استعادة الصفحة الأصلية</button>
    </div>
  </div>

  <div class="card">
    <button class="btn btn-send" id="sendToUploaderBtn" onclick="sendToUploaderPage()" disabled>
      🚀 حفظ وإرسال الفصل جاهزاً إلى صفحة الرفع (Uploader)
    </button>
  </div>
</div>

<script>
const canvas = document.getElementById('pageCanvas');
const ctx = canvas.getContext('2d');
let pages = []; // [{ name, originalImg, workCanvas, history: [ImageData] }]
let currentIdx = 0;
let mode = 'brush'; // 'brush' or 'scroll'
let isPainting = false;

function setStatus(text) {
  document.getElementById('statusMsg').innerText = text;
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('brushBtn').className = mode === 'brush' ? 'btn btn-active' : 'btn btn-dark';
  document.getElementById('scrollBtn').className = mode === 'scroll' ? 'btn btn-active' : 'btn btn-dark';
  if (mode === 'brush') canvas.classList.add('no-scroll');
  else canvas.classList.remove('no-scroll');
}

// 1. رفع ملف ZIP أو الصور
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  pages = [];
  currentIdx = 0;
  setStatus("⏳ جاري قراءة وتجهيز الصفحات...");

  const loadList = [];
  if (files[0].name.endsWith('.zip')) {
    const zip = await JSZip.loadAsync(files[0]);
    zip.forEach((path, entry) => {
      if (!entry.dir && /\.(jpe?g|png|webp)$/i.test(entry.name)) loadList.push({ name: entry.name, getBlob: () => entry.async('blob') });
    });
  } else {
    files.forEach(f => loadList.push({ name: f.name, getBlob: async () => f }));
  }

  loadList.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

  for (const item of loadList) {
    const blob = await item.getBlob();
    const img = await loadImg(blob);
    const workC = document.createElement('canvas');
    workC.width = img.width;
    workC.height = img.height;
    workC.getContext('2d').drawImage(img, 0, 0);
    pages.push({ name: item.name, originalImg: img, workCanvas: workC, history: [] });
  }

  document.getElementById('autoCleanBtn').disabled = false;
  document.getElementById('sendToUploaderBtn').disabled = false;
  setStatus(`✅ تم تجهيز ${pages.length} صفحة! اضغط على مسح الحروف التلقائي أو استخدم الفرشاة.`);
  drawPage();
});

function loadImg(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = URL.createObjectURL(blob);
  });
}

function saveHistory(page) {
  const wCtx = page.workCanvas.getContext('2d');
  if (page.history.length >= 8) page.history.shift();
  page.history.push(wCtx.getImageData(0, 0, page.workCanvas.width, page.workCanvas.height));
}

// 2. عرض الصفحة + العلامة المائية + الشريط السفلي
function drawPage() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  const wCanvas = page.workCanvas;
  const footerH = Math.max(36, Math.floor(wCanvas.height * 0.03));

  canvas.width = wCanvas.width;
  canvas.height = wCanvas.height + footerH;

  ctx.drawImage(wCanvas, 0, 0);

  // العلامة المائية الشفافة
  ctx.save();
  ctx.font = `900 ${Math.max(18, Math.floor(wCanvas.width * 0.03))}px 'Tajawal', sans-serif`;
  ctx.fillStyle = "rgba(255, 42, 95, 0.30)";
  ctx.textAlign = "left";
  ctx.fillText("futaarab.com", 20, wCanvas.height - 20);
  ctx.restore();

  // الشريط السفلي الثابت
  ctx.fillStyle = "#0a0a0c";
  ctx.fillRect(0, wCanvas.height, canvas.width, footerH);
  ctx.fillStyle = "#ffffff";
  ctx.font = `700 ${Math.max(14, Math.floor(footerH * 0.48))}px 'Tajawal', sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("تمت ترجمة هذا العمل بواسطة موقع futaarab.com", canvas.width / 2, wCanvas.height + footerH / 2);

  document.getElementById('pageCount').innerText = `${currentIdx + 1} / ${pages.length}`;
}

// 3. خوارزمية مسح الحروف المعزولة فقط (Connected-Component Character Eraser)
// لا ترسم أي مربعات! تمسح فقط الكتل السوداء الصغيرة (الحروف) المحاطة ببياض بنسبة 100%
function eraseIsolatedLettersOnCanvas(wCanvas) {
  const w = wCanvas.width;
  const h = wCanvas.height;
  const wCtx = wCanvas.getContext('2d');
  const imgData = wCtx.getImageData(0, 0, w, h);
  const data = imgData.data;

  const visited = new Uint8Array(w * h);
  // حجم الحرف الأقصى نسبةً لعرض الصفحة (أي خط رسم أو شعر أكبر من هذا الحجم لن يُلمس أبداً!)
  const maxCharWidth = Math.max(18, Math.floor(w * 0.032));
  const maxCharHeight = Math.max(22, Math.floor(w * 0.038));

  const isDark = (i) => data[i*4] < 160 && data[i*4+1] < 160 && data[i*4+2] < 160;
  const isPureWhite = (i) => data[i*4] > 238 && data[i*4+1] > 238 && data[i*4+2] > 238;

  const charsToErase = [];

  for (let y = 10; y < h - 10; y++) {
    for (let x = 10; x < w - 10; x++) {
      const startIdx = y * w + x;
      if (visited[startIdx] || !isDark(startIdx)) continue;

      // نجمع كل البكسلات المتصلة بهذا الشكل الأسود
      const component = [startIdx];
      visited[startIdx] = 1;
      let minX = x, maxX = x, minY = y, maxY = y;
      let ptr = 0;
      let tooBig = false;

      while (ptr < component.length) {
        const curr = component[ptr++];
        const cy = Math.floor(curr / w);
        const cx = curr % w;

        if (cx < minX) minX = cx;
        if (cx > maxX) maxX = cx;
        if (cy < minY) minY = cy;
        if (cy > maxY) maxY = cy;

        // إذا تجاوز الشكل حجم الحرف الواحد (مثل خط شعر أو عين أو إطار فقاعة)، نتوقف فوراً ولا نمسحه!
        if ((maxX - minX) > maxCharWidth || (maxY - minY) > maxCharHeight || component.length > 900) {
          tooBig = true;
        }

        // فحص الجيران الـ 8
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = cx + dx, ny = cy + dy;
            if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
              const nIdx = ny * w + nx;
              if (!visited[nIdx] && isDark(nIdx)) {
                visited[nIdx] = 1;
                if (!tooBig) component.push(nIdx);
              }
            }
          }
        }
      }

      if (tooBig || component.length < 3) continue;

      // الآن نتأكد أن هذا الحرف الصغير يقع داخل فقاعة بيضاء نقية (نختبر المحيط الخارجي للحرف)
      const pad = 4;
      const bMinX = Math.max(0, minX - pad), bMaxX = Math.min(w - 1, maxX + pad);
      const bMinY = Math.max(0, minY - pad), bMaxY = Math.min(h - 1, maxY + pad);
      let borderTotal = 0, borderWhite = 0;

      for (let bx = bMinX; bx <= bMaxX; bx++) {
        borderTotal += 2;
        if (isPureWhite(bMinY * w + bx)) borderWhite++;
        if (isPureWhite(bMaxY * w + bx)) borderWhite++;
      }
      for (let by = bMinY; by <= bMaxY; by++) {
        borderTotal += 2;
        if (isPureWhite(by * w + bMinX)) borderWhite++;
        if (isPureWhite(by * w + bMaxX)) borderWhite++;
      }

      // إذا كان محيط الحرف أبيض نقي بنسبة تزيد عن 82%، فهو حرف داخل فقاعة بيضاء!
      if ((borderWhite / borderTotal) > 0.82) {
        charsToErase.push({ component, minX, maxX, minY, maxY });
      }
    }
  }

  // مسح الحروف المكتشفة فقط وتنظيف الحواف الرمادية الدقيقة حول الحرف (Anti-aliasing)
  for (const item of charsToErase) {
    for (let py = Math.max(0, item.minY - 2); py <= Math.min(h - 1, item.maxY + 2); py++) {
      for (let px = Math.max(0, item.minX - 2); px <= Math.min(w - 1, item.maxX + 2); px++) {
        const idx = (py * w + px) * 4;
        data[idx] = 255;
        data[idx + 1] = 255;
        data[idx + 2] = 255;
      }
    }
  }

  wCtx.putImageData(imgData, 0, 0);
}

// تشغيل المسح التلقائي لكل الصفحات
async function autoCleanTextOnly() {
  if (!pages.length) return;
  document.getElementById('autoCleanBtn').disabled = true;

  for (let i = 0; i < pages.length; i++) {
    setStatus(`⏳ جاري مسح الحروف من الصفحة ${i + 1} من ${pages.length}...`);
    await new Promise(r => setTimeout(r, 30));
    saveHistory(pages[i]);
    eraseIsolatedLettersOnCanvas(pages[i].workCanvas);
  }

  drawPage();
  document.getElementById('autoCleanBtn').disabled = false;
  setStatus("🎉 تم مسح الحروف! استخدم الفرشاة لمسح أي كلمة متبقية بلمسة إصبعك.");
}

// 4. فرشاة المسح اليدوية السريعة والدقيقة (بإصبعك مباشرة)
function getCoords(e) {
  const r = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (cx - r.left) * (canvas.width / r.width),
    y: (cy - r.top) * (canvas.height / r.height)
  };
}

function paintWhiteAt(x, y) {
  const page = pages[currentIdx];
  const wCtx = page.workCanvas.getContext('2d');
  const radius = parseInt(document.getElementById('brushSize').value) * (canvas.width / 600);
  wCtx.save();
  wCtx.beginPath();
  wCtx.arc(x, y, radius, 0, Math.PI * 2);
  wCtx.fillStyle = "#ffffff";
  wCtx.fill();
  wCtx.restore();
  drawPage();
}

canvas.addEventListener('pointerdown', e => {
  if (!pages.length || mode !== 'brush') return;
  saveHistory(pages[currentIdx]);
  isPainting = true;
  const p = getCoords(e);
  paintWhiteAt(p.x, p.y);
});

canvas.addEventListener('pointermove', e => {
  if (!isPainting || mode !== 'brush') return;
  const p = getCoords(e);
  paintWhiteAt(p.x, p.y);
});

window.addEventListener('pointerup', () => {
  isPainting = false;
});

function undoLastAction() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  if (page.history.length > 0) {
    const prevData = page.history.pop();
    page.workCanvas.getContext('2d').putImageData(prevData, 0, 0);
    drawPage();
  }
}

function resetCurrentPage() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  saveHistory(page);
  page.workCanvas.getContext('2d').drawImage(page.originalImg, 0, 0);
  drawPage();
}

function changePage(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < pages.length) { currentIdx = next; drawPage(); }
}

// 5. إرسال الفصل جاهزاً إلى صفحة الرفع uploader.html
async function sendToUploaderPage() {
  if (!pages.length) return;
  setStatus("⏳ جاري ضغط الصفحات بصيغة WebP وتجهيزها للنقل...");
  const zip = new JSZip();
  const savedIdx = currentIdx;

  for (let i = 0; i < pages.length; i++) {
    currentIdx = i;
    drawPage();
    const webpBlob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.85));
    zip.file(`page_${String(i + 1).padStart(3, '0')}.webp`, webpBlob);
  }
  currentIdx = savedIdx;
  drawPage();

  const zipBlob = await zip.generateAsync({ type: 'blob' });

  const req = indexedDB.open("FutaArabBridgeDB", 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore("files");
  req.onsuccess = e => {
    const db = e.target.result;
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").put(zipBlob, "readyChapterZip");
    tx.oncomplete = () => {
      window.location.href = "uploader.html?autoLoad=true";
    };
  };
}
</script>
</body>
</html>
