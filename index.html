<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مبيض الفصول الذكي - FutaArab</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0a0a0c;
      --bg-card: #141418;
      --primary: #ff2a5f;
      --text-light: #ffffff;
      --text-gray: #9ca3af;
      --border-color: #26262e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: var(--bg-main); color: var(--text-light); padding: 12px; }

    .container { max-width: 600px; margin: 0 auto; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .title { font-size: 16px; font-weight: 900; color: var(--primary); margin-bottom: 10px; display: flex; justify-content: space-between; }

    .btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 14px;
      font-weight: 700; color: #fff; background: var(--primary); cursor: pointer; margin-top: 8px;
    }
    .btn:disabled { opacity: 0.5; }
    .btn-dark { background: #26262e; }
    .btn-active { background: #10b981; }
    .btn-send { background: #10b981; font-size: 15px; }

    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; }
    input[type="file"] { width: 100%; padding: 10px; background: #1c1c22; border: 1px dashed var(--primary); border-radius: 8px; color: var(--text-gray); }

    .status { font-size: 13px; color: #fbbf24; text-align: center; margin: 8px 0; font-weight: 700; }
    
    .canvas-box { background: #000; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-top: 8px; text-align: center; }
    canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; touch-action: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">
      <span>1. رفع وتبييض الفقاعات الذكي</span>
      <span style="color:var(--text-gray); font-size:12px;">futaarab.com</span>
    </div>
    
    <input type="file" id="fileInput" accept=".zip,image/*" multiple>
    <div class="status" id="statusMsg">اختر ملف ZIP أو صور الفصل للبدء...</div>

    <button class="btn" id="autoCleanBtn" onclick="autoCleanAllBubbles()" disabled>
      ✨ تبييض الفقاعات تلقائياً (فوري وبدون لمس الرسمة)
    </button>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0; margin-bottom:8px;">
      <button class="btn btn-dark" style="width:auto; margin:0; padding:8px 16px;" onclick="changePage(-1)">◀ السابق</button>
      <span id="pageCount" style="font-weight:bold;">0 / 0</span>
      <button class="btn btn-dark" style="width:auto; margin:0; padding:8px 16px;" onclick="changePage(1)">التالي ▶</button>
    </div>

    <!-- أزرار اختيار أداة اللمس -->
    <div class="row" style="margin-bottom: 8px;">
      <button class="btn btn-active" id="wandModeBtn" style="margin:0; font-size:12px;" onclick="setTool('wand')">
        🪄 لمسة سحرية (المس الفقاعة لتفريغها)
      </button>
      <button class="btn btn-dark" id="rectModeBtn" style="margin:0; font-size:12px;" onclick="setTool('rect')">
        ⬛ سحب مربع يدوي
      </button>
    </div>
    
    <div class="canvas-box">
      <canvas id="pageCanvas"></canvas>
    </div>

    <div class="row">
      <button class="btn btn-dark" onclick="undoLastAction()">↩️ تراجع عن آخر مسحة</button>
      <button class="btn btn-dark" onclick="resetCurrentPage()">🔄 استعادة الصفحة الأصلية</button>
    </div>
  </div>

  <div class="card">
    <button class="btn btn-send" id="sendToUploaderBtn" onclick="sendToUploaderPage()" disabled>
      🚀 حفظ وإرسال الفصل جاهزاً إلى صفحة الرفع (Uploader)
    </button>
  </div>
</div>

<script>
const canvas = document.getElementById('pageCanvas');
const ctx = canvas.getContext('2d');
let pages = []; // [{ name, img, boxes: [{x, y, w, h}] }]
let currentIdx = 0;
let currentTool = 'wand'; // 'wand' or 'rect'
let isDrawing = false, startX = 0, startY = 0;

function setStatus(text) {
  document.getElementById('statusMsg').innerText = text;
}

function setTool(tool) {
  currentTool = tool;
  document.getElementById('wandModeBtn').className = tool === 'wand' ? 'btn btn-active' : 'btn btn-dark';
  document.getElementById('rectModeBtn').className = tool === 'rect' ? 'btn btn-active' : 'btn btn-dark';
}

// 1. رفع ملف ZIP أو الصور
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  pages = [];
  currentIdx = 0;
  setStatus("⏳ جاري قراءة وتجهيز الصفحات...");

  if (files[0].name.endsWith('.zip')) {
    const zip = await JSZip.loadAsync(files[0]);
    const entries = [];
    zip.forEach((path, entry) => {
      if (!entry.dir && /\.(jpe?g|png|webp)$/i.test(entry.name)) entries.push(entry);
    });
    entries.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    for (const entry of entries) {
      const blob = await entry.async('blob');
      pages.push({ name: entry.name, img: await loadImg(blob), boxes: [] });
    }
  } else {
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    for (const file of files) {
      pages.push({ name: file.name, img: await loadImg(file), boxes: [] });
    }
  }

  document.getElementById('autoCleanBtn').disabled = false;
  document.getElementById('sendToUploaderBtn').disabled = false;
  setStatus(`✅ تم تجهيز ${pages.length} صفحة! اضغط على التبييض التلقائي أو المس أي فقاعة.`);
  drawPage();
});

function loadImg(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = URL.createObjectURL(blob);
  });
}

// 2. رسم الصفحة + التبييض + العلامة المائية والشريط السفلي
function drawPage() {
  if (!pages.length) return;
  const page = pages[currentIdx];
  const img = page.img;
  const footerH = Math.max(36, Math.floor(img.height * 0.03));

  canvas.width = img.width;
  canvas.height = img.height + footerH;

  ctx.drawImage(img, 0, 0);

  // رسم التبييض فوق النص فقط داخل الفقاعات
  ctx.fillStyle = "#ffffff";
  page.boxes.forEach(b => {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });

  // العلامة المائية الشفافة
  ctx.save();
  ctx.font = `900 ${Math.max(18, Math.floor(img.width * 0.03))}px 'Tajawal', sans-serif`;
  ctx.fillStyle = "rgba(255, 42, 95, 0.30)";
  ctx.textAlign = "left";
  ctx.fillText("futaarab.com", 20, img.height - 20);
  ctx.restore();

  // الشريط السفلي الثابت
  ctx.fillStyle = "#0a0a0c";
  ctx.fillRect(0, img.height, canvas.width, footerH);
  ctx.fillStyle = "#ffffff";
  ctx.font = `700 ${Math.max(14, Math.floor(footerH * 0.48))}px 'Tajawal', sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("تمت ترجمة هذا العمل بواسطة موقع futaarab.com", canvas.width / 2, img.height + footerH / 2);

  document.getElementById('pageCount').innerText = `${currentIdx + 1} / ${pages.length}`;
}

// 3. خوارزمية كشف فقاعات المانغا المغلقة ومسح النص بداخلها فقط (بدون لمس الرسمة!)
function detectAndCleanBubblesOnImage(img) {
  // نصغر الصورة مؤقتاً في الذاكرة لسرعة فائقة (أقل من 0.2 ثانية للصفحة)
  const scale = 400 / img.width;
  const w = Math.floor(img.width * scale);
  const h = Math.floor(img.height * scale);

  const tempC = document.createElement('canvas');
  tempC.width = w; tempC.height = h;
  const tCtx = tempC.getContext('2d');
  tCtx.drawImage(img, 0, 0, w, h);
  const data = tCtx.getImageData(0, 0, w, h).data;

  const visited = new Uint8Array(w * h);
  const detectedBoxes = [];

  const isWhite = (idx) => data[idx*4] > 235 && data[idx*4+1] > 235 && data[idx*4+2] > 235;
  const isDark = (idx) => data[idx*4] < 100 && data[idx*4+1] < 100 && data[idx*4+2] < 100;

  for (let y = 5; y < h - 5; y += 2) {
    for (let x = 5; x < w - 5; x += 2) {
      const startIdx = y * w + x;
      if (visited[startIdx] || !isWhite(startIdx)) continue;

      // Flood Fill لإيجاد حدود المنطقة البيضاء (الفقاعة)
      let queue = [startIdx];
      visited[startIdx] = 1;
      let minX = x, maxX = x, minY = y, maxY = y;
      let count = 0;
      let touchesEdge = false;

      while (queue.length > 0) {
        const curr = queue.pop();
        const cy = Math.floor(curr / w);
        const cx = curr % w;
        count++;

        if (cx < minX) minX = cx;
        if (cx > maxX) maxX = cx;
        if (cy < minY) minY = cy;
        if (cy > maxY) maxY = cy;

        if (cx <= 2 || cx >= w - 3 || cy <= 2 || cy >= h - 3) touchesEdge = true;

        const neighbors = [curr - 1, curr + 1, curr - w, curr + w];
        for (const n of neighbors) {
          if (n >= 0 && n < w * h && !visited[n] && isWhite(n)) {
            visited[n] = 1;
            queue.push(n);
          }
        }
      }

      const bw = maxX - minX;
      const bh = maxY - minY;
      const area = bw * bh;

      // شروط فقاعة المانغا: لا تلمس حواف الصفحة، وحجمها منطقي، وشكلها شبه بيضاوي/عمودي
      if (!touchesEdge && count > 180 && area < (w * h * 0.28) && (bw / bh) < 2.2 && (bh / bw) < 4.5) {
        // نفحص قلب الفقاعة فقط (نترك هامش 18% من الحواف لكي لا نمسح إطار الفقاعة الأسود)
        const padX = Math.floor(bw * 0.18);
        const padY = Math.floor(bh * 0.18);
        const inMinX = minX + padX, inMaxX = maxX - padX;
        const inMinY = minY + padY, inMaxY = maxY - padY;

        let darkPixels = 0, whitePixels = 0, innerTotal = 0;
        let textMinX = inMaxX, textMaxX = inMinX, textMinY = inMaxY, textMaxY = inMinY;

        for (let iy = inMinY; iy <= inMaxY; iy++) {
          for (let ix = inMinX; ix <= inMaxX; ix++) {
            const idx = iy * w + ix;
            innerTotal++;
            if (isWhite(idx)) whitePixels++;
            if (isDark(idx)) {
              darkPixels++;
              if (ix < textMinX) textMinX = ix;
              if (ix > textMaxX) textMaxX = ix;
              if (iy < textMinY) textMinY = iy;
              if (iy > textMaxY) textMaxY = iy;
            }
          }
        }

        const darkRatio = darkPixels / (innerTotal || 1);
        const whiteRatio = whitePixels / (innerTotal || 1);

        // الفقاعة الحقيقية يكون قلبها أبيض (>65%) وفيها نص أسود بنسبة بين 2% و 30%
        if (whiteRatio > 0.65 && darkRatio > 0.015 && darkRatio < 0.32 && textMaxX > textMinX) {
          detectedBoxes.push({
            x: (textMinX - 3) / scale,
            y: (textMinY - 3) / scale,
            w: (textMaxX - textMinX + 6) / scale,
            h: (textMaxY - textMinY + 6) / scale
          });
        }
      }
    }
  }
  return detectedBoxes;
}

// تشغيل التبييض التلقائي لكل الصفحات
async function autoCleanAllBubbles() {
  if (!pages.length) return;
  document.getElementById('autoCleanBtn').disabled = true;

  for (let i = 0; i < pages.length; i++) {
    setStatus(`⏳ جاري تنظيف فقاعات الصفحة ${i + 1} من ${pages.length}...`);
    await new Promise(r => setTimeout(r, 30)); // لتحديث الواجهة
    const newBoxes = detectAndCleanBubblesOnImage(pages[i].img);
    pages[i].boxes.push(...newBoxes);
  }

  drawPage();
  document.getElementById('autoCleanBtn').disabled = false;
  setStatus("🎉 تم تبييض الفقاعات! إذا بقيت فقاعة المسها بإصبعك لتفريغها فوراً.");
}

// 4. أداة اللمسة السحرية (Magic Wand): تلمس أي مكان داخل الفقاعة فيمسح الكلام كله فوراً!
function magicWandCleanAt(clickX, clickY) {
  const page = pages[currentIdx];
  const img = page.img;
  const scale = 500 / img.width;
  const w = Math.floor(img.width * scale);
  const h = Math.floor(img.height * scale);

  const tempC = document.createElement('canvas');
  tempC.width = w; tempC.height = h;
  const tCtx = tempC.getContext('2d');
  tCtx.drawImage(img, 0, 0, w, h);
  const data = tCtx.getImageData(0, 0, w, h).data;

  const startX = Math.floor(clickX * scale);
  const startY = Math.floor(clickY * scale);
  if (startY >= h || startX >= w) return;

  // نبحث عن أقرب نقطة بيضاء حول مكان لمس الإصبع
  const isWhite = (idx) => data[idx*4] > 210 && data[idx*4+1] > 210 && data[idx*4+2] > 210;
  const isDark = (idx) => data[idx*4] < 130 && data[idx*4+1] < 130 && data[idx*4+2] < 130;

  let seedIdx = startY * w + startX;
  if (!isWhite(seedIdx)) {
    for (let r = 1; r <= 12; r++) {
      const testIdx = (startY + r) * w + startX;
      if (testIdx < w * h && isWhite(testIdx)) { seedIdx = testIdx; break; }
    }
  }

  const visited = new Uint8Array(w * h);
  const queue = [seedIdx];
  visited[seedIdx] = 1;
  let minX = startX, maxX = startX, minY = startY, maxY = startY;
  let count = 0;

  while (queue.length > 0 && count < 45000) {
    const curr = queue.pop();
    const cy = Math.floor(curr / w);
    const cx = curr % w;
    count++;

    if (cx < minX) minX = cx;
    if (cx > maxX) maxX = cx;
    if (cy < minY) minY = cy;
    if (cy > maxY) maxY = cy;

    const neighbors = [curr - 1, curr + 1, curr - w, curr + w];
    for (const n of neighbors) {
      if (n >= 0 && n < w * h && !visited[n] && isWhite(n)) {
        visited[n] = 1;
        queue.push(n);
      }
    }
  }

  // نجد حدود النص الأسود داخل هذه الفقاعة التي لمستها ونمسحه بالكامل
  const padX = Math.max(3, Math.floor((maxX - minX) * 0.14));
  const padY = Math.max(3, Math.floor((maxY - minY) * 0.14));
  let tMinX = maxX, tMaxX = minX, tMinY = maxY, tMaxY = minY, foundDark = false;

  for (let y = minY + padY; y <= maxY - padY; y++) {
    for (let x = minX + padX; x <= maxX - padX; x++) {
      if (isDark(y * w + x)) {
        foundDark = true;
        if (x < tMinX) tMinX = x;
        if (x > tMaxX) tMaxX = x;
        if (y < tMinY) tMinY = y;
        if (y > tMaxY) tMaxY = y;
      }
    }
  }

  if (foundDark) {
    page.boxes.push({
      x: (tMinX - 4) / scale,
      y: (tMinY - 4) / scale,
      w: (tMaxX - tMinX + 8) / scale,
      h: (tMaxY - tMinY + 8) / scale
    });
    drawPage();
  }
}

// التفاعل باللمس على الكانفاس
function getCoords(e) {
  const r = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) };
}

canvas.addEventListener('pointerdown', e => {
  if (!pages.length) return;
  const p = getCoords(e);
  if (currentTool === 'wand') {
    magicWandCleanAt(p.x, p.y);
  } else {
    startX = p.x; startY = p.y; isDrawing = true;
  }
});

canvas.addEventListener('pointerup', e => {
  if (!isDrawing || currentTool !== 'rect') return;
  isDrawing = false;
  const p = getCoords(e);
  const bx = Math.min(startX, p.x), by = Math.min(startY, p.y);
  const bw = Math.abs(p.x - startX), bh = Math.abs(p.y - startY);
  if (bw > 8 && bh > 8) {
    pages[currentIdx].boxes.push({ x: bx, y: by, w: bw, h: bh });
    drawPage();
  }
});

function undoLastAction() {
  if (!pages.length) return;
  pages[currentIdx].boxes.pop();
  drawPage();
}

function resetCurrentPage() {
  if (!pages.length) return;
  pages[currentIdx].boxes = [];
  drawPage();
}

function changePage(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < pages.length) { currentIdx = next; drawPage(); }
}

// 5. إرسال الفصل جاهزاً إلى صفحة الرفع uploader.html
async function sendToUploaderPage() {
  if (!pages.length) return;
  setStatus("⏳ جاري ضغط الصفحات بصيغة WebP وتجهيزها للنقل...");
  const zip = new JSZip();
  const savedIdx = currentIdx;

  for (let i = 0; i < pages.length; i++) {
    currentIdx = i;
    drawPage();
    const webpBlob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.85));
    zip.file(`page_${String(i + 1).padStart(3, '0')}.webp`, webpBlob);
  }
  currentIdx = savedIdx;
  drawPage();

  const zipBlob = await zip.generateAsync({ type: 'blob' });

  const req = indexedDB.open("FutaArabBridgeDB", 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore("files");
  req.onsuccess = e => {
    const db = e.target.result;
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").put(zipBlob, "readyChapterZip");
    tx.oncomplete = () => {
      window.location.href = "uploader.html?autoLoad=true";
    };
  };
}
</script>
</body>
</html>
